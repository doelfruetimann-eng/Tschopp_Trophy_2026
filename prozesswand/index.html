<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSTO/SYMA Prozesswand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --line:#d9dde3; --muted:#6b7280; --accent:#3f6fb0; --bg:#eef0f3; --ok:#2f8a4c; --warn:#b14b46; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { font:13px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#1d2530; background:var(--bg); display:flex; flex-direction:column; }

header { display:flex; align-items:center; gap:8px; padding:8px 14px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1 { font-size:16px; margin:0 6px 0 0; }
header .sub { font-size:11px; color:var(--muted); margin-right:auto; }
header button { font:inherit; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--line); border-radius:6px; background:#f6f7f9; padding:6px 11px; }
header button:hover { background:#eceef2; }
header button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
header button.primary:hover { background:#355f97; }
header button.active { background:#e3ecf7; border-color:var(--accent); color:var(--accent); }
.savedTag { font-size:11px; color:var(--ok); min-width:70px; text-align:right; }
.userTag { font-size:11px; color:var(--muted); }

#main { flex:1; display:flex; min-height:0; }
#wallScroll { flex:1; overflow:auto; position:relative; }
#wallCanvas { position:relative; background:#fff; }

.lane-label { position:absolute; left:0; width:150px; padding:8px 10px; border-right:2px solid #c3c9d1; border-bottom:1px solid var(--line); background:#f8f9fb; z-index:15; cursor:default; box-shadow:2px 0 4px rgba(0,0,0,.06); }
.lane-label b { display:block; font-size:11.5px; }
.lane-label span { display:block; font-size:10px; color:var(--muted); margin-top:2px; line-height:1.3; }
.lane-row { position:absolute; border-bottom:1px solid var(--line); z-index:1; }
.lane-row.alt { background:#fbfcfd; }

.phase-head { position:absolute; top:0; height:60px; background:#f2f5f9; border-right:1px solid var(--line); border-bottom:2px solid #c3c9d1; padding:8px 10px; z-index:8; cursor:pointer; overflow:hidden; }
.phase-head:hover { background:#e9eef5; }
.phase-head b { font-size:12px; display:block; }
.phase-head small { font-size:10px; color:var(--muted); }
.phase-resize { position:absolute; top:0; bottom:0; right:-4px; width:9px; cursor:ew-resize; z-index:9; }
.phase-resize:hover { background:rgba(63,111,176,.3); }
.phase-sep { position:absolute; width:0; border-left:1px dashed #ccd3dc; z-index:2; pointer-events:none; }

.postit { position:absolute; width:172px; min-height:52px; padding:7px 9px; font-size:11.5px; line-height:1.35; border-radius:6px; box-shadow:0 2px 5px rgba(0,0,0,.18); cursor:grab; z-index:12; white-space:pre-wrap; word-wrap:break-word; user-select:none; }
.postit:active { cursor:grabbing; }
.postit.sel { outline:3px solid var(--accent); }
.postit.dim { opacity:.55; }
.postit.guide-now { outline:3px solid #b3543f; box-shadow:0 0 0 6px rgba(179,84,63,.28), 0 3px 10px rgba(0,0,0,.3); z-index:30; }
#overlay.guide-pos { background:rgba(20,28,40,.10); align-items:flex-start; justify-content:flex-end; padding:64px 14px 0 0; }
#overlay.guide-pos .modal { width:460px; max-width:92vw; max-height:80vh; box-shadow:0 8px 30px rgba(0,0,0,.35), 0 0 0 2px #b3543f; }

.ms-line { position:absolute; width:0; border-left:2px dashed #b3543f; z-index:6; pointer-events:none; }
.ms-flag { position:absolute; transform:translateX(-50%); background:#b3543f; color:#fff; font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:5px; z-index:14; cursor:grab; white-space:nowrap; max-width:200px; overflow:hidden; text-overflow:ellipsis; box-shadow:0 1px 4px rgba(0,0,0,.25); }

#conns { position:absolute; left:0; top:0; z-index:11; pointer-events:none; }
#conns path.cas { fill:none; stroke:#fff; stroke-width:6; opacity:.85; }
#conns path.vis { fill:none; stroke:#1f5fae; stroke-width:2.6; marker-end:url(#arr); }
#conns path.hit { fill:none; stroke:rgba(0,0,0,0); stroke-width:14; }
body.connect #conns path.hit { pointer-events:stroke; cursor:pointer; }

aside { width:332px; background:#fff; border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.ki-tools { display:flex; gap:6px; padding:8px 10px; border-bottom:1px solid var(--line); background:#f8f9fb; }
.ki-tools button { flex:1; font:inherit; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--line); border-radius:6px; background:#fff; padding:6px 8px; }
.ki-tools button:hover { background:#eceef2; }
.ki-head { padding:9px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:6px; }
.ki-head b { font-size:13px; }
.ki-head button { font:inherit; font-size:11px; cursor:pointer; border:1px solid var(--line); border-radius:5px; background:#f6f7f9; padding:3px 8px; }
#kiLog { flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
.msg { max-width:95%; padding:7px 10px; border-radius:8px; font-size:12px; white-space:pre-wrap; word-wrap:break-word; }
.msg.user { align-self:flex-end; background:#e3ecf7; }
.msg.ai { align-self:flex-start; background:#f1f2f5; }
.msg.sys { align-self:center; background:none; color:var(--muted); font-size:11px; text-align:center; }
.ki-foot { border-top:1px solid var(--line); padding:8px; }
#chatRow { display:flex; gap:6px; }
#chatInput { flex:1; font:inherit; font-size:12px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; resize:none; }
#sendBtn { font:inherit; font-size:12px; font-weight:600; cursor:pointer; border:0; border-radius:6px; background:var(--accent); color:#fff; padding:0 14px; }

#goalbar { display:flex; align-items:center; gap:10px; padding:8px 14px; background:#fff; border-top:1px solid var(--line); box-shadow:0 -1px 4px rgba(0,0,0,.06); }
#goalbar label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); white-space:nowrap; }
#goalInput { flex:1; font:inherit; font-size:13px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; resize:none; min-height:34px; line-height:1.35; }
#smartBtn, #swarmBtn { font:inherit; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; border:0; border-radius:6px; background:var(--accent); color:#fff; padding:8px 14px; }
#smartBtn:hover, #swarmBtn:hover { background:#355f97; }
#swarmBtn { background:#2f8a4c; }
#swarmBtn:hover { background:#27703f; }

#overlay { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(20,28,40,.45); }
.modal { background:#fff; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.25); width:430px; max-width:94vw; max-height:88vh; overflow-y:auto; padding:18px 20px; }
.modal h3 { margin:0 0 12px; font-size:15px; }
.modal label { display:block; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin:10px 0 3px; }
.modal input[type=text], .modal input[type=password], .modal textarea, .modal select { width:100%; font:inherit; font-size:13px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; resize:vertical; }
.modal .btnrow { display:flex; gap:8px; margin-top:16px; }
.modal .btnrow button { font:inherit; font-size:13px; font-weight:600; cursor:pointer; border-radius:7px; padding:8px 14px; border:1px solid var(--line); background:#f6f7f9; }
.modal .btnrow .go { background:var(--accent); border-color:var(--accent); color:#fff; }
.modal .btnrow .del { color:var(--warn); margin-left:auto; }
.swatches { display:flex; gap:7px; margin-top:4px; }
.swatch { width:30px; height:30px; border-radius:6px; cursor:pointer; border:2px solid rgba(0,0,0,.12); }
.swatch.sel { border-color:#1d2530; }
.modal.wide { width:820px; max-width:96vw; }
.ei-sub { font-size:12.5px; color:var(--muted); line-height:1.45; margin:2px 0 14px; }
.ei-ziel-big { width:100%; font:inherit; font-size:13px; line-height:1.45; padding:9px 11px; border:1px solid var(--line); border-radius:7px; resize:none; overflow:hidden; background:#fffef6; min-height:46px; }
.ei-wrap { display:grid; grid-template-columns:1fr 28px 1.55fr 28px 1fr; align-items:stretch; gap:6px; margin-top:8px; }
.ei-col { display:flex; flex-direction:column; }
.ei-col > label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin-bottom:5px; }
.ei-in > label, .ei-out > label { color:#3f6fb0; }
.ei-col textarea { width:100%; font:inherit; font-size:13px; line-height:1.45; padding:9px 11px; border:1px solid var(--line); border-radius:7px; resize:none; overflow:hidden; }
.ei-in textarea, .ei-out textarea { background:#f6f9fd; flex:1; min-height:170px; }
.ei-flow { align-self:center; text-align:center; color:var(--accent); font-size:24px; font-weight:700; }
.ei-egg { border:2.5px solid var(--accent); border-radius:46% / 11%; background:linear-gradient(#f5f9ff,#e9f1fb); padding:24px 30px; }
.ei-egg .ei-egg-h { text-align:center; font-size:12.5px; font-weight:700; letter-spacing:.5px; color:var(--accent); margin-bottom:14px; }
.ei-w { display:flex; flex-direction:column; gap:13px; }
.ei-w label { display:block; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:4px; }
.ei-w textarea { background:#fffef6; min-height:40px; }

#previewBar { position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:55; display:none; align-items:center; gap:10px; background:#233247; color:#fff; padding:10px 16px; border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.35); }
#previewBar b { font-size:13px; }
#previewBar button { font:inherit; font-size:12px; font-weight:700; cursor:pointer; border:0; border-radius:6px; padding:7px 12px; }
#pvNeu { background:#7a5cc4; color:#fff; }
#pvErsetzen { background:#3fa564; color:#fff; }
#pvErgaenzen { background:#4a7fc4; color:#fff; }
#pvVerwerfen { background:#6b7a8d; color:#fff; }
#boardSelect { font:inherit; font-size:12px; font-weight:600; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#f6f7f9; max-width:220px; cursor:pointer; }
.brd-row { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); }
.brd-row input { flex:1; font:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
.brd-row button { font:inherit; font-size:11.5px; cursor:pointer; border:1px solid var(--line); border-radius:5px; background:#f6f7f9; padding:5px 9px; }
.brd-row button:hover { background:#eceef2; }
.brd-row .brd-del { color:var(--warn); }
.brd-row.active input { border-color:var(--accent); background:#f2f7ff; font-weight:600; }

#authGate { position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center; background:var(--bg); }
.auth-card { background:#fff; padding:28px 30px; border-radius:12px; box-shadow:0 4px 22px rgba(0,0,0,.14); width:312px; }
.auth-card h2 { margin:0 0 4px; font-size:17px; }
.auth-card p { margin:0 0 16px; font-size:12px; color:var(--muted); line-height:1.4; }
.auth-card input { width:100%; font:inherit; font-size:14px; padding:9px 10px; border:1px solid var(--line); border-radius:7px; margin-bottom:9px; }
#authSubmit { width:100%; font:inherit; font-size:14px; font-weight:700; cursor:pointer; border:0; border-radius:7px; background:var(--accent); color:#fff; padding:10px; }
.auth-card .link { display:block; margin:12px auto 0; font-size:12px; color:var(--accent); background:none; border:0; cursor:pointer; }
.auth-err { color:var(--warn); font-size:12px; min-height:16px; margin-top:8px; text-align:center; }

/* ---- Status-Punkt auf Post-its (Hauptwand) ---- */
.postit .dot { position:absolute; top:5px; right:6px; width:10px; height:10px; border-radius:50%; border:1.5px solid rgba(0,0,0,.25); }
.dot.offen { background:#cfd5dd; } .dot.arbeit { background:#3f6fb0; } .dot.erledigt { background:#2f8a4c; }
.postit.st-erledigt { opacity:.72; }
.phase-zoom { position:absolute; top:6px; right:6px; z-index:10; font-size:12px; line-height:1; border:1px solid var(--line); border-radius:5px; background:#fff; cursor:pointer; padding:3px 5px; }
.phase-zoom:hover { background:#e3ecf7; border-color:var(--accent); }
.phase-fit { position:absolute; top:6px; right:32px; z-index:10; font-size:12px; line-height:1; border:1px solid var(--line); border-radius:5px; background:#fff; cursor:pointer; padding:3px 5px; }
.phase-fit:hover { background:#e3ecf7; border-color:var(--accent); }

/* ---- Phasen-Lupe ---- */
#lupe { position:fixed; inset:0; z-index:70; display:none; background:rgba(20,28,40,.5); }
#lupe .lupe-inner { position:absolute; inset:24px; background:#fff; border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.35); display:flex; flex-direction:column; overflow:hidden; }
.lupe-top { display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid var(--line); background:#f6f8fb; }
.lupe-top h2 { margin:0; font-size:16px; } .lupe-top .ph-no { font-size:11px; color:var(--muted); }
.lupe-top .sp { margin-left:auto; }
.lupe-top button { font:inherit; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--line); border-radius:6px; background:#fff; padding:6px 10px; }
.lupe-top button:hover { background:#eceef2; }
.lupe-top .lupe-close { background:var(--accent); color:#fff; border-color:var(--accent); }
.lupe-body { flex:1; overflow-y:auto; padding:16px 18px; }
.lupe-tools { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.lupe-tools button { font:inherit; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--accent); color:var(--accent); border-radius:16px; background:#eef4fb; padding:6px 12px; }
.lupe-tools button:hover { background:#dfeaf7; }
.lupe-tools button:disabled { opacity:.5; cursor:default; }
.ei-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-bottom:8px; }
.ei-grid .full { grid-column:1 / -1; }
.ei-grid label { display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin-bottom:2px; }
.ei-grid textarea { width:100%; font:inherit; font-size:12.5px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; resize:vertical; min-height:38px; }
.lupe-sec { margin-top:18px; border-top:1px solid var(--line); padding-top:12px; }
.lupe-sec h3 { margin:0 0 8px; font-size:13px; display:flex; align-items:center; gap:8px; }
.lupe-sec h3 .cnt { font-size:11px; color:var(--muted); font-weight:400; }
.lupe-sec h3 .add { margin-left:auto; font-size:11px; font-weight:600; cursor:pointer; border:1px dashed var(--line); border-radius:6px; background:#fafbfc; padding:3px 9px; color:var(--accent); }
.tk { display:flex; align-items:flex-start; gap:9px; padding:7px 9px; border:1px solid var(--line); border-radius:8px; margin-bottom:7px; background:#fff; }
.tk .tk-dot { flex:none; margin-top:2px; width:15px; height:15px; border-radius:50%; border:2px solid #cfd5dd; cursor:pointer; }
.tk .tk-dot.arbeit { background:#3f6fb0; border-color:#3f6fb0; } .tk .tk-dot.erledigt { background:#2f8a4c; border-color:#2f8a4c; }
.tk .tk-text { flex:1; font-size:12.5px; line-height:1.4; outline:none; min-height:18px; }
.tk .tk-text:focus { background:#fffdf0; }
.tk.done .tk-text { text-decoration:line-through; color:var(--muted); }
.tk button { flex:none; font-size:12px; cursor:pointer; border:1px solid var(--line); border-radius:5px; background:#f6f7f9; padding:2px 6px; }
.tk button:hover { background:#e9ecf1; }
.tk-ai-box { margin:0 0 9px 24px; padding:9px 11px; border-left:3px solid var(--accent); background:#f2f7fc; border-radius:0 8px 8px 0; font-size:12px; white-space:pre-wrap; }
.tk-ai-box .row { margin-top:8px; display:flex; gap:8px; }
.tk-ai-box button { font:inherit; font-size:11.5px; font-weight:600; cursor:pointer; border:0; border-radius:6px; padding:5px 10px; }
.tk-ai-box .take { background:#2f8a4c; color:#fff; } .tk-ai-box .drop { background:#6b7a8d; color:#fff; }
#lupeProp { margin:12px 0; padding:12px 14px; border:1px solid var(--accent); border-radius:10px; background:#f2f7fc; display:none; }
#lupeProp h4 { margin:0 0 8px; font-size:12.5px; }
#lupeProp label { display:flex; gap:8px; align-items:flex-start; font-size:12.5px; margin-bottom:6px; cursor:pointer; }
#lupeProp .row { margin-top:10px; display:flex; gap:8px; }
#lupeProp .row button { font:inherit; font-size:12px; font-weight:600; cursor:pointer; border:0; border-radius:6px; padding:6px 12px; }
#lupeProp .take { background:#2f8a4c; color:#fff; } #lupeProp .drop { background:#6b7a8d; color:#fff; }

/* ---- Dashboard ---- */
#dash { position:fixed; inset:0; z-index:70; display:none; background:rgba(20,28,40,.5); }
#dash .dash-inner { position:absolute; inset:24px; background:#f4f6f9; border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.35); display:flex; flex-direction:column; overflow:hidden; }
.dash-top { display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid var(--line); background:#fff; }
.dash-top h2 { margin:0; font-size:16px; }
.dash-top .sp { margin-left:auto; }
.dash-top button { font:inherit; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--line); border-radius:6px; background:#fff; padding:6px 12px; }
.dash-top .dash-close { background:var(--accent); color:#fff; border-color:var(--accent); }
.dash-body { flex:1; overflow-y:auto; padding:16px 18px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
.tile { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
.tile .tl { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
.tile .tv { font-size:22px; font-weight:700; margin-top:2px; }
.tile .ts { font-size:11px; color:var(--muted); }
.dash-sec { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
.dash-sec h3 { margin:0 0 10px; font-size:13px; }
table.ph-tab { width:100%; border-collapse:collapse; }
.ph-tab th, .ph-tab td { text-align:left; font-size:12px; padding:7px 8px; border-bottom:1px solid #edf0f4; vertical-align:middle; }
.ph-tab th { font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); }
.ph-tab tr.dash-row { cursor:pointer; }
.ph-tab tr.dash-row:hover td { background:#f2f7ff; }
.pbar { background:#e8ebef; border-radius:5px; height:9px; width:120px; overflow:hidden; }
.pbar > div { height:100%; background:#2f8a4c; border-radius:5px; }
.gate-mini { font-size:11px; color:#b3543f; }
.kan { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.kan-col { background:#eef1f5; border-radius:10px; padding:10px; min-height:80px; }
.kan-col h4 { margin:0 0 8px; font-size:12px; display:flex; align-items:center; gap:7px; }
.kan-col h4 .kc { font-size:11px; font-weight:600; color:#fff; border-radius:9px; padding:1px 8px; }
.kan-col.k-offen h4 .kc { background:#8a94a3; } .kan-col.k-arbeit h4 .kc { background:#3f6fb0; } .kan-col.k-erledigt h4 .kc { background:#2f8a4c; }
.kan-card { background:#fff; border:1px solid var(--line); border-left:4px solid #8a94a3; border-radius:7px; padding:7px 9px; font-size:12px; line-height:1.35; margin-bottom:7px; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.kan-col.k-arbeit .kan-card { border-left-color:#3f6fb0; } .kan-col.k-erledigt .kan-card { border-left-color:#2f8a4c; }
.kan-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.15); }
.kan-card .kp { font-size:10px; font-weight:700; color:var(--muted); }
.kan-hint { font-size:11px; color:var(--muted); margin-top:6px; }
@media (max-width:900px) { .kan { grid-template-columns:1fr; } }

/* KI-Dialog pro Aufgabe (hell) */
.tk-ai-msgs { max-height:320px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
.tk-ai-msgs .am { padding:7px 10px; border-radius:8px; font-size:12.5px; line-height:1.45; white-space:pre-wrap; max-width:92%; }
.tk-ai-msgs .am.user { align-self:flex-end; background:#e3ecf7; }
.tk-ai-msgs .am.ai { align-self:flex-start; background:#f1f2f5; }
.tk-ai-in { display:flex; gap:6px; margin-top:9px; }

  <h1>OSTO/SYMA Prozesswand</h1>
  <button id="dashBtn" class="primary">Dashboard</button>

  <span class="savedTag" id="savedTag"></span>
  <button id="undoBtn" style="display:none" title="Letzte &Auml;nderung r&uuml;ckg&auml;ngig machen">&#8617; Retour</button>

  <button id="addMs">+ Meilenstein</button>

  <aside>

    <div class="ki-foot">
      <div id="chatRow">
        <textarea id="chatInput" rows="2" placeholder="Frage an den KI-Moderator..."></textarea>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

const APP_VERSION = 'V21';

/* ====== SUPABASE ====== */
const SUPABASE_URL = 'https://bvbjxofdcugpfsccwlzv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_eK2xQpV8jfkeMKcC40QDhQ_4Oj2ip--';

/* ---------- OSTO/SYMA-Ebenen ---------- */
const LANES = [
  { key:'reflexion', title:'Reflexionsebene',       desc:'Wechselwirkungen · Störungen · Risiken' },
  { key:'input',     title:'Inputebene',            desc:'Experten & Beeinflusser – welche / wer?' },
  { key:'mgmt1',     title:'Managementebene 1',     desc:'Bereichsleitung · strategische Führung' },
  { key:'mgmt2',     title:'Managementebene 2',     desc:'Projektleitung · Führung & Entscheid' },
  { key:'sache',     title:'Sachebene',             desc:'Meilensteine & Zwischenziele · Phasenlinie' },
  { key:'handlung',  title:'Handlungen / Aktionen', desc:'Operatives Tun · Tätigkeiten' },
  { key:'doku',      title:'Dokumentationsebene',   desc:'Wer? Wann? Was? Wie?' },
  { key:'anspruch',  title:'Anspruchsgruppen',      desc:'Stakeholder · Betroffene' }
];
const LANE_KEYS = LANES.map(l => l.key);
const PALETTE = ['#fdf3bf','#ffd9e0','#cdeccd','#d2e4f5','#e7e3ef'];
const LANE_COLOR = { reflexion:'#ffd9e0', input:'#fdf3bf', mgmt1:'#d2e4f5', mgmt2:'#d2e4f5', sache:'#fdf3bf', handlung:'#cdeccd', doku:'#e7e3ef', anspruch:'#ffd9e0' };

const LABEL_W = 150, HEADER_H = 60, LANE_H = 104, PHASE_W = 300, PI_W = 172;
const STORE = 'osto-prozesswand-v3';

/* ---------- Zustand ---------- */
let state, previewState = null, previewMeta = null;
let convo = [];
let connectMode = false, connectSrc = null;
let undoBackup = null;
let sb = null, currentUser = null, cloudTimer = null;
let collection = { boards: [], activeId: null };

function defaultState() {
  const phases = [
    'Auftrags- & Situationsanalyse', 'Zielanalyse', 'Lösungskonzept / Synthese',
    'Bewertung & Entscheid', 'Umsetzung', 'Kontrolle & Feedback'
  ].map(n => ({ id: uid('ph'), name: n, w: PHASE_W, ziel:'', input:'', output:'', wer:'', was:'', wann:'', wie:'' }));
  const laneY = k => LANE_KEYS.indexOf(k) * LANE_H + 14;
  const phaseX = i => i * PHASE_W + (PHASE_W - PI_W) / 2;
  const a = { id: uid('p'), x: phaseX(1), y: laneY('sache'), text: 'Beispiel: Post-it anfassen und frei in der Zeit verschieben.', color: PALETTE[3] };
  const b = { id: uid('p'), x: phaseX(2), y: laneY('handlung'), text: 'Beispiel: über «Verbinden» entsteht der Netzplan.', color: PALETTE[2] };
  return {
    goal: '', phases,
    postits: [a, b],
    connections: [{ id: uid('c'), from: a.id, to: b.id }],
    milestones: [{ id: uid('m'), x: 3 * PHASE_W, label: 'Konzept-Entscheid' }],
    laneTitles: {}
  };
}
function uid(p) { return (p||'i') + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function clamp(v,a,b) { return Math.max(a, Math.min(b, v)); }
function activeState() { return previewState || state; }

function normalizeState(d) {
  const s = {
    goal: d.goal || '',
    phases: Array.isArray(d.phases) ? d.phases : [],
    postits: Array.isArray(d.postits) ? d.postits : [],
    connections: Array.isArray(d.connections) ? d.connections : [],
    milestones: Array.isArray(d.milestones) ? d.milestones : [],
    laneTitles: d.laneTitles || {},
    kiLog: Array.isArray(d.kiLog) ? d.kiLog : [],
    kiConvo: Array.isArray(d.kiConvo) ? d.kiConvo : []
  };
  s.phases.forEach(p => { if (typeof p.w !== 'number' || p.w < 80) p.w = PHASE_W; });
  return s;
}
/* ---------- Sammlung mehrerer Prozesswände (Boards) ---------- */
function activeBoard() { return collection.boards.find(b => b.id === collection.activeId) || collection.boards[0] || null; }
function syncActive() { const b = activeBoard(); if (b) b.state = state; }
function refreshFromState() {
  goalInput.value = state.goal || ''; autoResizeGoal(); render();
  kiLog.innerHTML = '';
  convo = Array.isArray(state.kiConvo) ? state.kiConvo.slice() : [];
  (Array.isArray(state.kiLog) ? state.kiLog : []).forEach(m => addMsg(m.cls, m.text, { restore: true }));
}
function activateBoard(id) {
  if (id) collection.activeId = id;
  let b = activeBoard();
  if (!b) { b = { id: uid('b'), name: 'Meine Wand', state: defaultState() }; collection.boards.push(b); collection.activeId = b.id; }
  collection.activeId = b.id; state = b.state;
  renderBoardSelect(); refreshFromState();
}
function newBoardFrom(name, st, activate) {
  const b = { id: uid('b'), name: name || 'Neue Wand', state: st || defaultState() };
  collection.boards.push(b);
  if (activate !== false) { collection.activeId = b.id; state = b.state; renderBoardSelect(); refreshFromState(); }
  save();
  return b;
}
function loadCollection(d) {
  collection = { boards: [], activeId: null };
  if (d && d.logo) collection.logo = d.logo;
  if (d && d.apiKey) collection.apiKey = d.apiKey;
  if (d && Array.isArray(d.templates)) collection.templates = d.templates;
  if (d && Array.isArray(d.boards) && d.boards.length) {
    collection.boards = d.boards.map(b => ({ id: b.id || uid('b'), name: b.name || 'Wand', state: normalizeState(b.state || {}) }));
    collection.activeId = d.activeId || collection.boards[0].id;
  } else if (d && Array.isArray(d.phases) && d.phases.length) {
    const b = { id: uid('b'), name: 'Meine Wand', state: normalizeState(d) }; collection.boards = [b]; collection.activeId = b.id;
  } else {
    const b = { id: uid('b'), name: 'Meine Wand', state: defaultState() }; collection.boards = [b]; collection.activeId = b.id;
  }
  if (!collection.boards.find(b => b.id === collection.activeId)) collection.activeId = collection.boards[0].id;
  activateBoard(collection.activeId);
}
function renderBoardSelect() {
  const sel = document.getElementById('boardSelect'); if (!sel) return;
  sel.innerHTML = collection.boards.map(b => '<option value="' + b.id + '"' + (b.id === collection.activeId ? ' selected' : '') + '>' + esc(b.name) + '</option>').join('');
}

let undoStack = [], undoSkip = false, lastSaved = null, lastSavedBoard = null;
function save() {
  syncActive();
  const cur = JSON.stringify(state), bid = collection.activeId;
  if (!undoSkip && lastSaved !== null && lastSavedBoard === bid && lastSaved !== cur) {
    undoStack.push({ bid, snap: lastSaved });
    if (undoStack.length > 30) undoStack.shift();
  }
  lastSaved = cur; lastSavedBoard = bid;
  localStorage.setItem(STORE, JSON.stringify(collection));
  const t = document.getElementById('savedTag');
  t.textContent = 'gespeichert'; setTimeout(() => { t.textContent = ''; }, 1300);
  scheduleCloudSave();
  updateUndoBtn();
}
function updateUndoBtn() {
  document.getElementById('undoBtn').style.display = undoStack.some(u => u.bid === collection.activeId) ? '' : 'none';
}

/* ---------- Geometrie ---------- */
function canvasW(s) { s = s || activeState(); return Math.max(600, s.phases.reduce((t, p) => t + p.w, 0)); }
function phaseLeft(i, s) { s = s || activeState(); let x = 0; for (let k = 0; k < i && k < s.phases.length; k++) x += s.phases[k].w; return x; }
function canvasH() { return LANES.length * LANE_H; }
function laneTitle(l) { return activeState().laneTitles[l.key] || l.title; }
function getPostit(id) { return activeState().postits.find(p => p.id === id); }

/* ---------- Rendering ---------- */
const canvas = document.getElementById('wallCanvas');
function render() {
  const s = activeState();
  const W = canvasW(s), H = canvasH();
  canvas.style.width = (LABEL_W + W) + 'px';
  canvas.style.height = (HEADER_H + H) + 'px';
  let h = '';

  LANES.forEach((l, i) => {
    h += '<div class="lane-row' + (i % 2 ? ' alt' : '') + '" data-laneidx="' + i + '" style="left:' + LABEL_W + 'px;top:' + (HEADER_H + i*LANE_H) + 'px;width:' + W + 'px;height:' + LANE_H + 'px"></div>';
    h += '<div class="lane-label" data-lane="' + l.key + '" style="top:' + (HEADER_H + i*LANE_H) + 'px;height:' + LANE_H + 'px"><b>' + esc(laneTitle(l)) + '</b><span>' + esc(l.desc) + '</span></div>';
  });

  s.phases.forEach((p, i) => {
    const left = LABEL_W + phaseLeft(i, s);
    h += '<div class="phase-head" data-pi="' + i + '" style="left:' + left + 'px;width:' + p.w + 'px"><b>' + esc(p.name) + '</b><small>Phase ' + (i+1) + ' · klicken = System-Ei</small><button class="phase-fit" data-fi="' + i + '" title="' + (p.w >= openWidthOf(i) - 4 ? 'Phase zusammenschieben (komprimiert)' : 'Phase öffnen – alle Post-its nebeneinander') + '">&#8646;</button><button class="phase-zoom" data-zi="' + i + '" title="Phasen-Lupe: im Detail bearbeiten">&#128269;</button><div class="phase-resize" data-ri="' + i + '"></div></div>';
    if (i > 0) h += '<div class="phase-sep" style="left:' + left + 'px;top:' + HEADER_H + 'px;height:' + H + 'px"></div>';
  });

  const flagTop = HEADER_H + LANE_KEYS.indexOf('sache') * LANE_H + 3;
  s.milestones.forEach(m => {
    const x = LABEL_W + clamp(m.x, 0, W);
    const short = (m.label || '').split(/\s[–-]\sKriterien/)[0];
    h += '<div class="ms-line" style="left:' + x + 'px;top:' + HEADER_H + 'px;height:' + H + 'px"></div>';
    h += '<div class="ms-flag" data-mid="' + m.id + '" style="left:' + x + 'px;top:' + flagTop + 'px" title="' + esc(m.label) + '">&#9670; ' + esc(short) + '</div>';
  });

  s.postits.forEach(p => {
    const st = p.status || 'offen';
    h += '<div class="postit st-' + st + (connectSrc === p.id ? ' sel' : '') + '" data-pid="' + p.id + '" style="left:' + (LABEL_W + p.x) + 'px;top:' + (HEADER_H + p.y) + 'px;background:' + (p.color || PALETTE[0]) + '"><span class="dot ' + st + '"></span>' + esc(p.text) + '</div>';
  });

  h += '<svg id="conns" width="' + (LABEL_W + W) + '" height="' + (HEADER_H + H) + '"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fae"/></marker></defs>';
  s.connections.forEach(c => {
    const a = s.postits.find(p => p.id === c.from), b = s.postits.find(p => p.id === c.to);
    if (!a || !b) return;
    const ax = LABEL_W + a.x + PI_W/2, ay = HEADER_H + a.y + 28;
    const bx = LABEL_W + b.x + PI_W/2, by = HEADER_H + b.y + 28;
    const mx = (ax + bx) / 2;
    const d = 'M' + ax + ',' + ay + ' C' + mx + ',' + ay + ' ' + mx + ',' + by + ' ' + bx + ',' + by;
    h += '<path class="cas" d="' + d + '"/><path class="vis" d="' + d + '"/><path class="hit" data-cid="' + c.id + '" d="' + d + '"/>';
  });
  h += '</svg>';

  canvas.innerHTML = h;
  syncLaneLabels();
  if (guide) markGuideCard();
}
const wallScrollEl = document.getElementById('wallScroll');
function syncLaneLabels() {
  const sl = wallScrollEl.scrollLeft;
  canvas.querySelectorAll('.lane-label').forEach(el => { el.style.left = sl + 'px'; });
}
wallScrollEl.addEventListener('scroll', syncLaneLabels);
/* Mausrad = horizontal scrollen; Shift+Rad = vertikal */
wallScrollEl.addEventListener('wheel', e => {
  if (e.ctrlKey) return;
  if (e.shiftKey) { wallScrollEl.scrollTop += e.deltaY; e.preventDefault(); return; }
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { wallScrollEl.scrollLeft += e.deltaY; e.preventDefault(); }
}, { passive: false });

/* ---------- Interaktion (Delegation) ---------- */
let drag = null;

canvas.addEventListener('pointerdown', e => {
  if (previewState) return;
  const rs = e.target.closest('.phase-resize');
  if (rs) {
    const i = +rs.dataset.ri;
    drag = { type:'resize', i, x0:e.clientX, w0: state.phases[i].w,
      mine: LANE_KEYS.map(k => cardsInPhaseLane(i, k).map(c => c.id)) };
    e.preventDefault(); return;
  }
  const ms = e.target.closest('.ms-flag');
  if (ms) { const m = state.milestones.find(x => x.id === ms.dataset.mid); drag = { type:'ms', m, x0:e.clientX, mx0:m.x, moved:false }; e.preventDefault(); return; }
  const pi = e.target.closest('.postit');
  if (pi && !connectMode) {
    const p = getPostit(pi.dataset.pid);
    drag = { type:'pi', p, el:pi, x0:e.clientX, y0:e.clientY, px0:p.x, py0:p.y, moved:false };
    e.preventDefault();
  }
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.type === 'pi') {
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    drag.p.x = clamp(drag.px0 + dx, 0, canvasW() - PI_W);
    drag.p.y = clamp(drag.py0 + dy, 0, canvasH() - 40);
    drag.el.style.left = (LABEL_W + drag.p.x) + 'px';
    drag.el.style.top = (HEADER_H + drag.p.y) + 'px';
  } else if (drag.type === 'ms') {
    const dx = e.clientX - drag.x0;
    if (Math.abs(dx) > 3) drag.moved = true;
    drag.m.x = clamp(drag.mx0 + dx, 0, canvasW() - 2);
    render();
  } else if (drag.type === 'resize') {
    state.phases[drag.i].w = clamp(drag.w0 + (e.clientX - drag.x0), 140, 900);
    render();
  }
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag;
  const moved = d.moved || d.type === 'resize';
  drag = null;
  if (d.type === 'resize') {
    const p = state.phases[d.i], delta = p.w - d.w0;
    if (delta) delete p.fitBack; // manuelle Breite hebt den Aufzieh-Merker auf
    const mineIds = new Set([].concat(...(d.mine || [])));
    if (delta) {
      const oldRight = phaseLeft(d.i) + d.w0;
      state.postits.forEach(c => { if (!mineIds.has(c.id) && c.x >= oldRight - 1) c.x = Math.max(0, c.x + delta); });
      state.milestones.forEach(m => { if (m.x >= oldRight - 4) m.x = Math.max(0, m.x + delta); });
    }
    arrangePhaseCards(d.i, (d.mine || []).map(ids => ids.map(id => getPostit(id)).filter(Boolean)));
  }
  if (moved) { save(); render(); }
});

/* Phase auf Karten-Breite bringen & Post-its nebeneinander anordnen */
function resizePhaseTo(i, newW, mineIds) {
  const p = state.phases[i], oldW = p.w;
  newW = clamp(Math.round(newW), 180, 1800);
  if (newW === oldW) return;
  const oldRight = phaseLeft(i) + oldW, delta = newW - oldW;
  p.w = newW;
  state.postits.forEach(c => { if (!(mineIds && mineIds.has(c.id)) && c.x >= oldRight - 1) c.x = Math.max(0, c.x + delta); });
  state.milestones.forEach(m => { if (m.x >= oldRight - 4) m.x = Math.max(0, m.x + delta); });
}
function arrangePhaseCards(i, byLane) {
  const p = state.phases[i]; if (!p) return;
  const left = phaseLeft(i);
  const colsFit = Math.max(1, Math.floor((p.w - 16) / (PI_W + 10)));
  byLane.forEach((cards, li) => {
    const n = cards.length; if (!n) return;
    // 2 Reihen übereinander nutzen die Ebenenhöhe; Spalten nur so viele wie nötig
    const useRows = n > 1 ? 2 : 1;
    cards.slice().sort((a, b) => (a.x - b.x) || (a.y - b.y)).forEach((c, j) => {
      const row = j % useRows, col = Math.floor(j / useRows);
      c.x = clamp(left + 10 + (col % colsFit) * (PI_W + 10), 0, canvasW(state) - PI_W);
      c.y = li * LANE_H + 4 + row * 50 + Math.floor(col / colsFit) * 12;
    });
  });
}
function arrangePhase(i) { arrangePhaseCards(i, LANE_KEYS.map(k => cardsInPhaseLane(i, k))); }
const FIT_MIN = 220;
function openWidthOf(i) {
  const maxN = Math.max(1, ...LANE_KEYS.map(k => cardsInPhaseLane(i, k).length));
  return Math.max(PHASE_W, 24 + Math.ceil(maxN / 2) * (PI_W + 10));
}
function fitPhase(i) {
  const p = state.phases[i];
  const byLane = LANE_KEYS.map(k => cardsInPhaseLane(i, k));
  const mineIds = new Set([].concat(...byLane.map(a => a.map(c => c.id))));
  const openW = Math.max(PHASE_W, 24 + Math.ceil(Math.max(1, ...byLane.map(a => a.length)) / 2) * (PI_W + 10));
  if (p.w >= openW - 4) resizePhaseTo(i, FIT_MIN, mineIds);   // ist offen → komprimieren
  else resizePhaseTo(i, openW, mineIds);                       // ist zu → öffnen
  delete p.fitBack;
  arrangePhaseCards(i, byLane);
  save(); render();
}

canvas.addEventListener('click', e => {
  if (previewState) return;
  if (connectMode) {
    const hit = e.target.closest('.hit');
    if (hit) { state.connections = state.connections.filter(c => c.id !== hit.dataset.cid); save(); render(); return; }
    const pi = e.target.closest('.postit');
    if (pi) {
      const id = pi.dataset.pid;
      if (!connectSrc) { connectSrc = id; render(); }
      else if (connectSrc !== id) {
        state.connections.push({ id: uid('c'), from: connectSrc, to: id });
        connectSrc = null; save(); render();
      }
      return;
    }
    return;
  }

function cleanKey(s) { return (s || '').replace(/[^\x20-\x7E]/g, '').trim(); }
/* Modell-Wahl: Fable 5 für anspruchsvolle Denk-Rollen, automatischer Rückfall auf Sonnet */
const CHAT_MODEL = 'claude-fable-5';
async function callClaude(system, user, model, maxTok) {
  try { return await rawClaude(system, user, model, maxTok); }
  catch (e) {
    if (/model/i.test(e.message) && model !== MODEL_FALLBACK) return rawClaude(system, user, MODEL_FALLBACK, maxTok);
    throw e;
  }
}
async function rawClaude(system, user, model, maxTok) {
  const key = cleanKey(getKey());
  if (!key) throw new Error('Kein API-Schlüssel hinterlegt.');
  if (!/^sk-ant-/.test(key)) throw new Error('Der gespeicherte API-Schlüssel sieht unvollständig aus – bitte über «API-Schlüssel» komplett neu einfügen (beginnt mit sk-ant-…).');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({ model, max_tokens: maxTok || 2000, system, messages: [{ role: 'user', content: user }] })
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.error && data.error.message) || ('HTTP ' + res.status));
  return (data.content || []).map(b => b.text || '').join('');
}

async function runChat(prompt, label) {
  addMsg('user', label || prompt);

  try {
    convo.push({ role: 'user', content: prompt });
    if (convo.length > 12) convo = convo.slice(-12);

    if (!key) { wait.remove(); openKeyModal(() => runChat(prompt, label)); return; }
    const hist = convo.map(m => (m.role === 'user' ? 'Nutzer: ' : 'Moderator: ') + m.content).join('\n\n');
    const out = await callClaude(MODERATOR_SYS + wallContext(), hist, CHAT_MODEL, 1500);
    convo.push({ role: 'assistant', content: out });
    state.kiConvo = convo.slice(-24);
    wait.remove(); addMsg('ai', out);
  } catch (e) { wait.remove(); addMsg('sys', '❌ ' + e.message); }
}

async function agentCall(role, system, user, maxTok) {

function extractJSON(t) {
  t = t.replace(/```json/gi, '```').replace(/```/g, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error('Keine JSON-Antwort erhalten.');
  return JSON.parse(t.slice(a, b + 1));
}
async function agentJSON(role, system, user, maxTok) {
  const sys = system + '\n\nAntworte AUSSCHLIESSLICH mit gültigem JSON, ohne Erklärtext.';
  try { return extractJSON(await agentCall(role, sys, user, maxTok)); }
  catch (e) {
    if (e instanceof SyntaxError || /JSON/.test(e.message)) {
      return extractJSON(await agentCall(role, sys, user + '\n\nWICHTIG: Nur gültiges JSON ausgeben.', maxTok));
    }
    throw e;
  }
}

    const arch = await agentJSON('architekt',
      'Du bist der ARCHITEKT-Agent. Du stückelst ein Projekt in Phasen nach dieser Methodik:\n\n' + METHODIK
      + '\n\nErzeuge 4–8 projektspezifische Phasen. Format:\n{"phasen":[{"name":"...","anteil":15,"gate":{"name":"Entscheid: ...","kriterien":["messbares Kriterium 1","Kriterium 2"]}}]}\n"anteil" = geschätzter Anteil an der Projektdauer in Prozent (Summe ≈ 100).',
      'Gesamtziel: ' + cfg.ziel + '\nZeitrahmen: ' + (cfg.zeit || 'offen') + '\nKontext: ' + (cfg.kontext || 'keiner angegeben') + '\nDetailtiefe: ' + cfg.tiefe, 2500);
    if (!arch || !Array.isArray(arch.phasen) || arch.phasen.length < 3) throw new Error('Architekt lieferte keine brauchbare Phasenstruktur.');
    const phasen = arch.phasen.slice(0, 8);
    sysMsg('✅ ' + phasen.length + ' Phasen: ' + phasen.map(p => p.name).join(' → '));

    const plaene = [];
    for (let i = 0; i < phasen.length; i++) {
      const fein = i < 2 ? cfg.tiefe : 'grob';
      const nMax = TIEFE_N[fein];
      sysMsg('📋 Planer-Agent: Phase ' + (i+1) + ' – ' + phasen[i].name + ' (' + fein + ') …');
      let plan = null;
      for (let att = 0; att < 2 && !plan; att++) {
        try {
          plan = await agentJSON('planer',
            'Du bist der PLANER-Agent. Du planst EINE Phase nach dieser Methodik:\n\n' + METHODIK
            + '\n\nFormat:\n{"ei":{"ziel":"...","input":"...","output":"...","wer":"...","was":"...","wann":"...","wie":"..."},'
            + '"schritte":["..."],"ergebnisse":["..."],"management":["..."],"zwischenziele":["..."],"experten":["..."]}\n'
            + 'Max. ' + nMax + ' schritte, max. 3 ergebnisse, max. 2 management, max. 2 zwischenziele, max. 2 experten. Detailtiefe: ' + fein + '.',
            'Projektziel: ' + cfg.ziel + '\nZeitrahmen: ' + (cfg.zeit || 'offen') + '\nKontext: ' + (cfg.kontext || '-')
            + '\nPhase ' + (i+1) + ' von ' + phasen.length + ': ' + phasen[i].name
            + '\nGate am Phasenende: ' + (phasen[i].gate && phasen[i].gate.name || 'Entscheid')
            + (i > 0 ? '\nErgebnisse der Vorphase: ' + (plaene[i-1] && plaene[i-1].ergebnisse || []).join('; ') : ''), 2500);
        } catch (e) { if (att === 1) sysMsg('⚠️ Phase ' + (i+1) + ' übersprungen: ' + e.message); }
      }
      plaene.push(plan || { ei: {}, schritte: [], ergebnisse: [], management: [], zwischenziele: [], experten: [] });
    }

    sysMsg('🔍 Kritiker-Agent: Pre-Mortem, Retro & Anspruchsgruppen-Check …');
    let kritik = null;
    try {
      kritik = await agentJSON('kritiker',
        'Du bist der KRITIKER-Agent (Pre-Mortem und Anspruchsgruppen-Check) nach dieser Methodik:\n\n' + METHODIK
        + '\n\nFormat:\n{"phasen":[{"index":0,"risiken":["..."],"retro":"...","anspruchsgruppen":["..."],"review":"..."}]}\n'
        + 'Je Phase: max. 2 risiken (Pre-Mortem, konkret), 1 retro-Frage, max. 3 anspruchsgruppen (wer betroffen/wer fehlt), 1 review (Review-Punkt mit Anspruchsgruppen).',
        'Projektziel: ' + cfg.ziel + '\nKontext: ' + (cfg.kontext || '-') + '\nPhasen:\n'
        + phasen.map((p, i) => (i) + ': ' + p.name + ' | Schritte: ' + (plaene[i].schritte || []).join('; ')).join('\n'), 3000);
    } catch (e) { sysMsg('⚠️ Kritiker übersprungen: ' + e.message); }

    const pv = buildPreview(cfg, phasen, plaene, kritik);

    sysMsg('🔗 Verbinder-Agent knüpft Ablauf und Rückkopplungen …');
    try {
      const liste = pv.cards.map(c => c.key + ' [' + c.lane + ', Phase ' + (c.phase+1) + ']: ' + c.text.slice(0, 60)).join('\n');
      const verb = await agentJSON('verbinder',
        'Du bist der VERBINDER-Agent. Du verbindest Karten einer Prozesswand zu einem Netzplan (Vorgänger → Nachfolger), inklusive Rückkopplungen von Ergebnissen zur Management- oder Sachebene.\n'
        + 'Format: {"verbindungen":[["K1","K2"],["K2","K5"]]}\nMax. ' + Math.min(24, pv.cards.length * 2) + ' Verbindungen, nur sinnvolle.',
        'Karten:\n' + liste, 1800);
      if (verb && Array.isArray(verb.verbindungen)) {
        const byKey = {}; pv.cards.forEach(c => { byKey[c.key] = c.id; });
        verb.verbindungen.forEach(v => {
          if (Array.isArray(v) && byKey[v[0]] && byKey[v[1]] && v[0] !== v[1])
            pv.state.connections.push({ id: uid('c'), from: byKey[v[0]], to: byKey[v[1]] });
        });
      }
    } catch (e) { sysMsg('⚠️ Verbinder übersprungen – Standard-Kette wird genutzt.'); }
    if (!pv.state.connections.length) {
      for (let i = 0; i + 1 < pv.chain.length; i++)
        pv.state.connections.push({ id: uid('c'), from: pv.chain[i], to: pv.chain[i+1] });
    }

    previewState = pv.state; previewMeta = cfg;
    document.getElementById('previewBar').style.display = 'flex';
    render();
    sysMsg('✅ Entwurf fertig: ' + pv.state.postits.length + ' Post-its, ' + pv.state.connections.length + ' Verbindungen, ' + pv.state.milestones.length + ' Gates. Oben wählen: Ersetzen, Ergänzen oder Verwerfen.');
  } catch (e) {
    sysMsg('❌ Schwarm abgebrochen: ' + e.message);
  }
}

function buildPreview(cfg, phasen, plaene, kritik) {
  const totalW = Math.max(phasen.length, 6) * PHASE_W;
  const sumAnteil = phasen.reduce((t, p) => t + (typeof p.anteil === 'number' && p.anteil > 0 ? p.anteil : 100 / phasen.length), 0);
  const st = { goal: cfg.ziel, phases: [], postits: [], connections: [], milestones: [], laneTitles: Object.assign({}, state.laneTitles) };
  phasen.forEach((p, i) => {
    const anteil = (typeof p.anteil === 'number' && p.anteil > 0 ? p.anteil : 100 / phasen.length) / sumAnteil;
    const ei = plaene[i].ei || {};
    st.phases.push({ id: uid('ph'), name: p.name, w: clamp(Math.round(totalW * anteil), 220, 640),
      ziel: ei.ziel || '', input: ei.input || '', output: ei.output || '', wer: ei.wer || '', was: ei.was || '', wann: ei.wann || '', wie: ei.wie || '' });
  });

  const laneCount = {};
  const cards = [], chain = [];
  let kn = 0;
  function put(phaseIdx, laneKey, text, toChain) {
    const li = LANE_KEYS.indexOf(laneKey);
    const left = phaseLeft(phaseIdx, st), w = st.phases[phaseIdx].w;
    const ck = phaseIdx + '|' + laneKey;
    const k = laneCount[ck] = (laneCount[ck] || 0) + 1;
    const x = clamp(left + 10 + ((k-1) * 28) % Math.max(40, w - PI_W - 20), 0, canvasW(st) - PI_W);
    const y = li * LANE_H + 6 + ((k-1) * 22) % (LANE_H - 62);
    const id = uid('p');
    st.postits.push({ id, x, y, text, color: LANE_COLOR[laneKey] || PALETTE[0], checked: true });
    kn++; cards.push({ key: 'K' + kn, id, lane: laneKey, phase: phaseIdx, text });
    if (toChain) chain.push(id);
    return id;
  }

  phasen.forEach((p, i) => {
    const pl = plaene[i], kr = kritik && Array.isArray(kritik.phasen) ? (kritik.phasen.find(x => x.index === i) || {}) : {};
    (kr.risiken || []).slice(0, 2).forEach(t => put(i, 'reflexion', '⚠️ ' + t));
    if (kr.retro) put(i, 'reflexion', '↻ Retro: ' + kr.retro);
    (pl.experten || []).slice(0, 2).forEach(t => put(i, 'input', '💡 ' + t));
    (pl.management || []).slice(0, 2).forEach((t, j) => put(i, j === 0 ? 'mgmt2' : 'mgmt1', '🧭 ' + t));
    (pl.zwischenziele || []).slice(0, 2).forEach(t => put(i, 'sache', '🎯 ' + t));
    (pl.schritte || []).slice(0, 6).forEach(t => put(i, 'handlung', t, true));
    (pl.ergebnisse || []).slice(0, 3).forEach(t => put(i, 'doku', '📄 ' + t));
    (kr.anspruchsgruppen || []).slice(0, 3).forEach(t => put(i, 'anspruch', '👥 ' + t));
    if (kr.review) put(i, 'anspruch', '👥 Review: ' + kr.review);
    const gateName = (p.gate && p.gate.name) || ('Entscheid Phase ' + (i+1));
    const krit = p.gate && Array.isArray(p.gate.kriterien) && p.gate.kriterien.length ? ' – Kriterien: ' + p.gate.kriterien.join('; ') : '';
    st.milestones.push({ id: uid('m'), x: clamp(phaseLeft(i, st) + st.phases[i].w - 4, 20, canvasW(st) - 4), label: gateName + krit });
  });

  return { state: st, cards, chain };
}

/* ---------- Vorschau übernehmen / verwerfen ---------- */
function endPreview() {
  previewState = null; previewMeta = null;
  document.getElementById('previewBar').style.display = 'none';
}
document.getElementById('pvVerwerfen').onclick = () => { endPreview(); render(); sysMsg('Entwurf verworfen – deine Wand ist unverändert.'); };
document.getElementById('pvErsetzen').onclick = () => {
  undoBackup = JSON.stringify(state);
  state = previewState;
  endPreview();
  document.getElementById('undoBtn').style.display = '';
  goalInput.value = state.goal || ''; autoResizeGoal();
  save(); render();
  sysMsg('✅ Wand ersetzt. «Rückgängig» oben stellt den vorherigen Stand wieder her.');
};
document.getElementById('pvErgaenzen').onclick = () => {
  undoBackup = JSON.stringify(state);
  const pv = previewState;
  const maxX = canvasW(state) - PI_W - 4;
  pv.postits.forEach(p => { state.postits.push({ id: p.id, x: clamp(p.x, 0, maxX), y: p.y, text: p.text, color: p.color }); });
  pv.connections.forEach(c => state.connections.push(c));
  pv.milestones.forEach(m => state.milestones.push({ id: m.id, x: clamp(m.x, 0, canvasW(state) - 4), label: m.label }));
  state.phases.forEach((p, i) => {
    const q = pv.phases[i]; if (!q) return;
    ['ziel','input','output','wer','was','wann','wie'].forEach(k => { if (!p[k] && q[k]) p[k] = q[k]; });
  });
  if (!state.goal && pv.goal) { state.goal = pv.goal; goalInput.value = pv.goal; autoResizeGoal(); }
  endPreview();
  document.getElementById('undoBtn').style.display = '';
  save(); render();
  sysMsg('✅ Entwurf ergänzt (bestehende Post-its blieben erhalten). «Rückgängig» stellt den vorherigen Stand wieder her.');
};

/* ---------- Mehrere Wände: Auswahl & Verwaltung ---------- */
document.getElementById('boardSelect').onchange = e => {
  if (previewState) { renderBoardSelect(); return; }
  syncActive(); activateBoard(e.target.value); save();
};
document.getElementById('pvNeu').onclick = () => {
  const st = previewState;
  const nm = 'KI: ' + ((previewMeta && previewMeta.ziel) ? previewMeta.ziel.slice(0, 38) : 'Entwurf');
  endPreview();
  newBoardFrom(nm, st, true);
  sysMsg('✅ Entwurf als neue Wand «' + nm + '» angelegt. Deine bisherige Wand ist unverändert – oben links umschaltbar.');
};
document.getElementById('boardMenu').onclick = () => {
  if (previewState) return;
  syncActive();
  const rows = collection.boards.map(b =>
    '<div class="brd-row' + (b.id === collection.activeId ? ' active' : '') + '" data-bid="' + b.id + '">'
    + '<input type="text" value="' + esc(b.name) + '">'
    + (b.id === collection.activeId ? '<span style="font-size:11px;color:var(--muted)">aktiv</span>' : '<button class="brd-open">&Ouml;ffnen</button>')
    + (collection.boards.length > 1 ? '<button class="brd-del">L&ouml;schen</button>' : '')
    + '</div>').join('');
  openModal('<h3>Prozessw&auml;nde</h3><p style="font-size:12px;color:var(--muted);margin:0 0 8px">Jede Wand ist ein eigenes Projekt mit eigener Zeitachse, eigenen Post-its und eigenem KI-Verlauf.</p>'
    + rows + '<div class="btnrow"><button class="go" id="brdNew">+ Neue Wand</button><button id="brdDone">Fertig</button></div>');
  const applyNames = () => {
    modalBox.querySelectorAll('.brd-row').forEach(r => {
      const b = collection.boards.find(x => x.id === r.dataset.bid);
      const v = r.querySelector('input').value.trim();
      if (b && v) b.name = v;
    });
  };
  modalBox.querySelectorAll('.brd-open').forEach(btn => btn.onclick = () => {
    applyNames(); activateBoard(btn.closest('.brd-row').dataset.bid); save(); closeModal();
  });
  modalBox.querySelectorAll('.brd-del').forEach(btn => btn.onclick = () => {
    const row = btn.closest('.brd-row'), b = collection.boards.find(x => x.id === row.dataset.bid);
    if (!b || collection.boards.length <= 1) return;
    if (!btn.dataset.arm) { btn.dataset.arm = '1'; btn.textContent = 'Wirklich löschen?'; return; }
    applyNames();
    collection.boards = collection.boards.filter(x => x.id !== b.id);
    if (collection.activeId === b.id) activateBoard(collection.boards[0].id);
    save(); closeModal(); document.getElementById('boardMenu').click();
  });
  document.getElementById('brdNew').onclick = () => { applyNames(); closeModal(); newBoardFrom('Neue Wand', null, true); };
  document.getElementById('brdDone').onclick = () => { applyNames(); renderBoardSelect(); save(); closeModal(); };
};

function genAuftrag(ai) {

    + '<tr><td>Objekt / Standort</td><td class="platz">[Objekt, Adresse ergänzen]</td></tr>'
    + '<tr><td>Auftraggeber</td><td class="platz">[Auftraggeber ergänzen]</td></tr>'
    + '<tr><td>Projektkoordination</td><td>' + esc(p0.wer || '[ergänzen]') + '</td></tr>'
    + '<tr><td>Planung</td><td class="platz">[internes Projektteam / extern]</td></tr>'

    + '<p class="platz">[Fachliche Ausgangslage ergänzen: betrieblicher Anlass, Dringlichkeit, Bezug zum Betriebskonzept.]</p>';
  b += '<h2>2. Zielbild / Nutzung</h2>'
    + (ai.zielbild ? txtOrPlatz(ai.zielbild, '') : '<p>Nach Abschluss des Projekts soll Folgendes erreicht sein:</p>')
    + ulOrPlatz([state.goal].concat(state.phases.map(p => p.ziel && (p.name + ': ' + p.ziel))).filter(Boolean), 'Zielbild und Phasenziele ergänzen');
  b += '<h2>3. Nutzen</h2>' + (ai.nutzen ? txtOrPlatz(ai.nutzen, '') : '<ul><li class="platz">[betrieblicher Nutzen]</li><li class="platz">[qualitativer Nutzen]</li><li class="platz">[finanzieller Nutzen]</li></ul>');
  b += '<h2>4. Projektumfang</h2>'
    + '<p>Der Projektumfang umfasst die nachstehenden, in der Prozesswand erfassten Phasen und Aufgaben. Die Detailplanung und verbindliche Beauftragung erfolgen nach Freigabe.</p>';
  state.phases.forEach((p, i) => {

function genTermin() {
  const WKS = 16, totalPx = Math.max(1, canvasW(state));
  const wk = x => clamp(Math.floor(x / totalPx * WKS), 0, WKS - 1);
  const gantt = (a, b2) => { let g = ''; for (let w = 0; w < WKS; w++) g += '<td class="' + (w >= a && w <= b2 ? 'gt' : 'g') + '"></td>'; return g; };
  const dia = pos => { let g = ''; for (let w = 0; w < WKS; w++) g += (w === pos ? '<td class="g c" style="color:#651B32;font-weight:bold">&#9670;</td>' : '<td class="g"></td>'); return g; };
  const nbWks = '<td class="nb" colspan="' + WKS + '"></td>';
  const logo = collection.logo ? '<img src="' + collection.logo + '" class="logo">' : '';
  let rows = '';
  /* Kopfbereich wie Vorlage: Leerzeile, Titel, Projekt+Meta, Leerzeile */
  rows += '<tr><td class="nb" colspan="' + (6 + WKS) + '">&nbsp;</td></tr>';
  rows += '<tr><td class="nb"></td><td class="nb"></td><td class="tt" colspan="2">Grobterminprogramm</td><td class="nb"></td><td class="nb"></td><td class="nb r" colspan="' + WKS + '">' + logo + '</td></tr>';
  rows += '<tr><td class="nb"></td><td class="nb"></td><td class="st">' + esc(boardName()) + '</td><td class="nb"></td><td class="nb"></td><td class="nb"></td><td class="mt" colspan="' + WKS + '">Prozesswand &middot; ' + heute() + '</td></tr>';
  rows += '<tr><td class="nb" colspan="' + (6 + WKS) + '">&nbsp;</td></tr>';
  /* KW-Zeile über dem Kopf (wie Vorlage: W → und Nummern, 8pt fett grau) */
  rows += '<tr><td class="nb"></td><td class="nb"></td><td class="nb"></td><td class="nb"></td><td class="nb"></td><td class="nb" style="font-size:8pt;font-weight:bold;color:#666666;white-space:nowrap">W &rarr;</td>';
  for (let w = 1; w <= WKS; w++) rows += '<td class="gh">' + w + '</td>';
  rows += '</tr>';
  /* Bordeaux-Kopfzeile: Textspalten mit Rahmen, Wochenzellen nur Fill */
  rows += '<tr><th style="width:24pt">Nr.</th><th style="width:24pt"></th><th style="width:266pt">Aufgabe</th><th style="width:140pt">Verantwortlich</th><th class="c" style="width:35pt">Start</th><th class="c" style="width:35pt">Dauer</th>';
  for (let w = 0; w < WKS; w++) rows += '<td style="background:#651B32;border:none;width:21pt"></td>';
  rows += '</tr>';
  let n = 0;
  state.phases.forEach((p, i) => {
    rows += '<tr class="blk"><td>P' + (i+1) + '</td><td></td><td>Phase ' + (i+1) + ' &ndash; ' + esc(p.name) + (p.wann ? ' (' + esc(p.wann) + ')' : '') + '</td><td></td><td></td><td></td>';
    for (let w = 0; w < WKS; w++) rows += '<td class="gp"></td>';
    rows += '</tr>';
    const pb = wk(phaseLeft(i) + state.phases[i].w - 1);
    tasksOfPhase(i).forEach(c => {
      n++;
      const ta = wk(c.x);
      rows += '<tr><td class="c">' + n + '</td><td></td><td>' + esc(cleanTxt(c.text)) + '</td><td>' + esc(p.wer || '') + '</td><td class="c">W' + (ta+1) + '</td><td class="c">1 W</td>' + gantt(ta, Math.min(ta + 1, pb)) + '</tr>';
    });
  });
  state.milestones.forEach(m => {
    const short = m.label.split(/\s[–-]\sKriterien/)[0];
    rows += '<tr><td class="c" style="color:#651B32;font-weight:bold">&#9670;</td><td></td><td colspan="4">' + esc(short) + '</td>' + dia(wk(m.x)) + '</tr>';
  });
  /* Fussnoten wie Vorlage: 8.5pt kursiv grau, Gedankenstrich */
  rows += '<tr><td class="nb" colspan="' + (6 + WKS) + '">&nbsp;</td></tr>';
  rows += '<tr><td class="nb"></td><td class="nb"></td><td class="fuss" colspan="' + (4 + WKS) + '">&ndash;&nbsp;&nbsp;Wochenachse relativ (W1 = Projektstart), abgeleitet aus der Zeitachse der Prozesswand; Kalenderwochen eintragen.</td></tr>';
  rows += '<tr><td class="nb"></td><td class="nb"></td><td class="fuss" colspan="' + (4 + WKS) + '">&ndash;&nbsp;&nbsp;Automatisch erzeugt aus der Prozesswand am ' + heute() + ' &ndash; verbindliche Termine nach Offerten/Freigabe.</td></tr>';
  return xlsShell('Terminprogramm', '<table>' + rows + '</table>', { landscape: true, freezeRow: 6, freezeCol: 6 });
}

function genKosten() {
  const logo = collection.logo ? '<img src="' + collection.logo + '" class="logo">' : '';
  let r = 0, rows = '';
  const tr = (cls, html) => { r++; rows += '<tr' + (cls ? ' class="' + cls + '"' : '') + '>' + html + '</tr>'; };
  const nb = n => '<td class="nb"></td>'.repeat(n);
  /* Kopf wie Vorlage: Leerzeile, Titel, Projekt + Meta rechts, Leerzeile */
  tr('', '<td class="nb" colspan="8">&nbsp;</td>');
  tr('', nb(2) + '<td class="tt" colspan="4">Grobkostenvoranschlag (Richtwerte)</td><td class="nb r" colspan="2">' + logo + '</td>');
  tr('', '<td class="st" colspan="5">' + esc(boardName()) + '</td>' + nb(1) + '<td class="mt r" colspan="2">Prozesswand &middot; ' + heute() + '</td>');
  tr('', '<td class="nb" colspan="8">&nbsp;</td>');
  tr('', '<th style="width:46pt">Pos.</th><th style="width:30pt"></th><th style="width:277pt">Beschreibung</th><th class="c" style="width:46pt">Menge</th><th class="c" style="width:56pt">Einheit</th><th class="r" style="width:67pt">EP CHF</th><th class="r" style="width:77pt">Total CHF</th><th style="width:119pt">Verantwortlich</th>');
  const totCells = [];
  state.phases.forEach((p, i) => {
    const blk = String.fromCharCode(65 + i);
    tr('blk', '<td>' + blk + '</td><td></td><td>' + esc(p.name) + '</td><td></td><td></td><td></td><td></td><td></td>');

    tasksOfPhase(i).forEach((c, j) => {

      tr('', '<td>' + blk + '.' + ('0' + (j + 1)).slice(-2) + '</td><td></td><td>' + esc(cleanTxt(c.text)) + '</td><td class="ph c"></td><td class="c">pauschal</td><td class="ph r chf"></td><td class="r chf" x:fml="=D' + rr + '*F' + rr + '"></td><td>' + esc(p.wer || '') + '</td>');
    });
    const last = r;
    tr('tot', '<td></td><td></td><td>Zwischentotal ' + esc(p.name) + '</td><td></td><td></td><td></td><td class="r chf"' + (last >= first ? ' x:fml="=SUM(G' + first + ':G' + last + ')"' : '') + '></td><td></td>');
    totCells.push(r);
    tr('', '<td class="nb" colspan="8">&nbsp;</td>');
  });
  tr('ttl', '<td></td><td></td><td>TOTAL (exkl. MwSt., Richtwerte)</td><td></td><td></td><td></td><td class="r chf" x:fml="=' + totCells.map(t => 'G' + t).join('+') + '"></td><td></td>');
  const totalR = r;
  tr('', nb(2) + '<td class="nb">MwSt. 8.1%</td>' + nb(3) + '<td class="nb r chf" x:fml="=G' + totalR + '*0.081"></td>' + nb(1));
  const mwstR = r;
  tr('ttl', '<td></td><td></td><td>TOTAL inkl. MwSt.</td><td></td><td></td><td></td><td class="r chf" x:fml="=G' + totalR + '+G' + mwstR + '"></td><td></td>');
  tr('', '<td class="nb" colspan="8">&nbsp;</td>');
  ['&ndash;&nbsp;&nbsp;Gelb hinterlegte Felder (Menge, EP) sind Eingabefelder &ndash; das Total berechnet sich in Excel automatisch.',
   '&ndash;&nbsp;&nbsp;Richtwerte aus der Prozesswand; verbindliche Betr&auml;ge erst nach Einholung der Offerten.',
   '&ndash;&nbsp;&nbsp;Automatisch erzeugt aus der Prozesswand am ' + heute() + '.'
  ].forEach(t => { tr('', nb(2) + '<td class="fuss" colspan="6">' + t + '</td>'); });
  return xlsShell('Kostenvoranschlag', '<table>' + rows + '</table>', {});
}

   KI-CHECK – manuell ergänzte Post-its prüfen & bestätigen

document.getElementById('checkBtn').onclick = async () => {
  if (previewState) return;
  if (!getKey()) { openKeyModal(() => document.getElementById('checkBtn').click()); return; }
  const cards = state.postits.filter(c => !c.checked).slice(0, 24);
  if (!cards.length) { sysMsg('Alles bereits geprüft – keine neuen oder geänderten Post-its.', true); return; }
  addMsg('user', '[KI-Check] ' + cards.length + ' Post-it(s) prüfen');
  const wait = sysMsg('🔍 prüft Ebene, Formulierung, Dubletten …', true);
  const liste = cards.map((c, j) => 'K' + (j+1) + ' [Phase ' + (phaseIndexOfX(c.x)+1) + ' · ' + laneTitle(LANES[LANE_KEYS.indexOf(laneKeyOfY(c.y))]) + ']: ' + cleanTxt(c.text)).join('\n');
  try {
    const out = await callClaude(
      'Du prüfst Post-its einer OSTO/SYMA-Prozesswand nach der Methodik: 1) richtige Ebene? (Reflexion=Risiken, Input=Experten, Mgmt=Führung/Entscheid, Sache=Zwischenziele, Handlung=Tätigkeiten, Doku=Ergebnisse, Anspruchsgruppen=Betroffene) 2) klar und konkret formuliert? 3) Dublette zu Bestehendem? 4) fehlt eine offensichtliche Verbindung/Rückkopplung? '
      + 'Sei wohlwollend: bestätige, was in Ordnung ist. Antworte NUR als JSON: {"karten":[{"k":"K1","ok":true},{"k":"K2","ok":false,"hinweis":"kurz was stört","empfehlung":"kurz was tun"}]}',
      'Gesamtziel: ' + (state.goal || '-') + '\nZu prüfen:\n' + liste + '\n\nBestehende Wand (Kontext):\n' + wallContext(),
      CHAT_MODEL, 1800);
    const res = extractJSON(out);
    wait.remove();
    let okN = 0; const probleme = [];
    (res.karten || []).forEach(k => {
      const idx = parseInt(String(k.k || '').replace(/\D/g, ''), 10) - 1;
      const c = cards[idx]; if (!c) return;
      if (k.ok) { c.checked = true; okN++; }
      else probleme.push('«' + cleanTxt(c.text).slice(0, 60) + '»: ' + (k.hinweis || '') + (k.empfehlung ? ' → ' + k.empfehlung : ''));
    });
    save();
    addMsg('ai', '✅ ' + okN + ' Post-it(s) geprüft und bestätigt.' + (probleme.length ? '\n\n⚠️ Hinweise:\n– ' + probleme.join('\n– ') : '\nKeine Beanstandungen.'));
  } catch (e) { wait.remove(); addMsg('sys', '❌ KI-Check: ' + e.message); }
};
