const GUIDE_ORDER = ['sache', 'handlung', 'input', 'mgmt2', 'mgmt1', 'doku', 'anspruch', 'reflexion'];
let guide = null;
function markGuideCard() {
  canvas.querySelectorAll('.postit.guide-now').forEach(e => e.classList.remove('guide-now'));
  if (!guide) return;
  const id = guide.list[guide.idx], c = getPostit(id);
  const el = canvas.querySelector('.postit[data-pid="' + id + '"]');
  if (!el || !c) return;
  el.classList.add('guide-now');
  /* Wand so scrollen, dass die Karte links neben dem Begleiter-Fenster sichtbar ist */
  wallScrollEl.scrollLeft = Math.max(0, LABEL_W + c.x + PI_W / 2 - Math.max(220, (wallScrollEl.clientWidth - 480) / 2));
  wallScrollEl.scrollTop = Math.max(0, HEADER_H + c.y - wallScrollEl.clientHeight / 2 + 30);
}
function buildGuideList() {
  const list = [];
  state.phases.forEach((p, i) => {
    GUIDE_ORDER.forEach(k => {
      cardsInPhaseLane(i, k).sort((a, b) => (a.x - b.x) || (a.y - b.y)).forEach(c => list.push(c.id));
    });
  });
  return list;
}
document.getElementById('guideBtn').onclick = () => {
  if (previewState) return;
  const list = buildGuideList();
  if (!list.length) { sysMsg('Noch keine Post-its auf der Wand – zuerst «KI-Struktur» ausführen oder Karten anlegen.', true); return; }
  guide = { list, idx: 0 };
  renderGuide();
};
function renderGuide() {
  if (!guide) return;
  const c = getPostit(guide.list[guide.idx]);
  if (!c) { guide.list.splice(guide.idx, 1); if (!guide.list.length) { guide = null; closeModal(); return; } if (guide.idx >= guide.list.length) guide.idx = guide.list.length - 1; return renderGuide(); }
  const pi = phaseIndexOfX(c.x), p = state.phases[pi] || { name: '?' };
  const lane = LANES[LANE_KEYS.indexOf(laneKeyOfY(c.y))] || LANES[0];
  const st = c.status || 'offen';
  const last = guide.idx >= guide.list.length - 1;
  openModal('<h3>&#9654; Schritt ' + (guide.idx + 1) + ' von ' + guide.list.length + '</h3>'
    + '<div style="font-size:12px;color:var(--muted);margin:-6px 0 10px">Phase ' + (pi + 1) + ' &middot; <b>' + esc(p.name) + '</b> &middot; Ebene: ' + esc(laneTitle(lane)) + '</div>'
    + '<label>Dieser Schritt (anpassbar)</label><textarea id="gText" rows="3">' + esc(cleanTxt(c.text)) + '</textarea>'
    + '<label style="margin-top:10px">Erl&auml;uterung des Begleiters</label>'
    + '<div id="gExpl" style="font-size:12.5px;line-height:1.5;background:#f2f7fc;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:9px 11px;min-height:40px;white-space:pre-wrap">' + (c.guide ? esc(c.guide) : '&#129302; Erl&auml;uterung wird erstellt &hellip;') + '</div>'
    + '<label style="margin-top:10px">Status</label>'
    + '<div><button id="gStatus" style="font:inherit;font-size:12px;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:5px 12px;background:#f6f7f9">' + STATUS_LABEL[st] + ' &rarr; weiterschalten</button></div>'
    + '<div class="btnrow"><button id="gPrev"' + (guide.idx === 0 ? ' disabled' : '') + '>&#9664; Zur&uuml;ck</button>'
    + '<button class="go" id="gNext">' + (last ? 'Fertig &#10003;' : 'Weiter &#9654;') + '</button>'
    + '<button id="gRedo">&#129302; Neu erl&auml;utern</button>'
    + '<button id="gClose" style="margin-left:auto">Schliessen</button></div>', true);
  overlay.classList.add('guide-pos');
  markGuideCard();
  const saveText = () => {
    const v = document.getElementById('gText').value.trim();
    if (v && v !== cleanTxt(c.text)) {
      const prefix = (c.text.match(/^[⚠️↻👥📄🎯🧭💡]+\s*/u) || [''])[0];
      c.text = prefix + v; save(); render();
    }
  };
  document.getElementById('gText').addEventListener('change', saveText);
  document.getElementById('gStatus').onclick = function () {
    c.status = STATUS_NEXT[c.status || 'offen']; save(); render();
    this.textContent = STATUS_LABEL[c.status] + ' → weiterschalten';
  };
  document.getElementById('gPrev').onclick = () => { saveText(); if (guide.idx > 0) { guide.idx--; renderGuide(); } };
  document.getElementById('gNext').onclick = () => {
    saveText();
    if (last) { guide = null; closeModal(); sysMsg('✅ Prozess einmal komplett durchlaufen.', true); return; }
    guide.idx++; renderGuide();
  };
  document.getElementById('gRedo').onclick = () => { delete c.guide; document.getElementById('gExpl').innerHTML = '&#129302; Erl&auml;uterung wird erstellt &hellip;'; guideExplain(c, pi, lane); };
  document.getElementById('gClose').onclick = () => { saveText(); guide = null; closeModal(); };
  if (!c.guide) guideExplain(c, pi, lane);
}
async function guideExplain(c, pi, lane) {
  if (!getKey()) { const el = document.getElementById('gExpl'); if (el) el.textContent = 'Kein API-Schlüssel – Knopf «API-Schlüssel» im KI-Panel.'; return; }
  const p = state.phases[pi] || {};
  try {
    const out = await callClaude(
      'Du bist Prozessbegleiter in einer OSTO/SYMA-Prozesswand (Systems Engineering). Erkläre dem Nutzer den aktuellen Schritt in 3–4 kurzen Sätzen: was hier zu tun ist, warum an dieser Stelle im Prozess, worauf zu achten ist und wer einzubeziehen ist. Deutsch, direkt, praxisnah, kein Vorgeplänkel.',
      'Gesamtziel: ' + (state.goal || '-') + '\nPhase ' + (pi + 1) + ': ' + (p.name || '-') + (p.ziel ? ' – Phasenziel: ' + p.ziel : '')
      + '\nEbene: ' + laneTitle(lane) + ' (' + lane.desc + ')\nSchritt: "' + cleanTxt(c.text) + '"',
      CHAT_MODEL, 500);
    c.guide = out; save();
    const el = document.getElementById('gExpl');
    if (el && guide && getPostit(guide.list[guide.idx]) === c) el.textContent = out;
  } catch (e) {
    const el = document.getElementById('gExpl'); if (el) el.textContent = '❌ ' + e.message;
  }
}

/* ================================================================
   DASHBOARD – Fortschritt, Verantwortliche, Termine, Kanban
   ================================================================ */
function gateOfPhase(i) {
  const l = phaseLeft(i), r = l + state.phases[i].w;
  return state.milestones.find(m => m.x > l + state.phases[i].w * 0.4 && m.x <= r + 40);
}
function openDash() { if (previewState) return; document.getElementById('dash').style.display = 'block'; renderDash(); }
function closeDash() { document.getElementById('dash').style.display = 'none'; }
document.getElementById('dashBtn').onclick = openDash;
document.getElementById('dashClose').onclick = closeDash;
document.getElementById('dash').addEventListener('click', e => { if (e.target === document.getElementById('dash')) closeDash(); });

function renderDash() {
  const body = document.getElementById('dashBody');
  const all = [];
  state.phases.forEach((p, i) => tasksOfPhase(i).forEach(c => all.push({ c, i })));
  const nOffen = all.filter(t => (t.c.status||'offen') === 'offen').length;
  const nArbeit = all.filter(t => t.c.status === 'arbeit').length;
  const nDone = all.filter(t => t.c.status === 'erledigt').length;
  const pct = all.length ? Math.round(nDone / all.length * 100) : 0;
  let nRisk = 0; state.phases.forEach((p, i) => { nRisk += cardsInPhaseLane(i, 'reflexion').length; });

  let h = '<div class="tiles">'
    + '<div class="tile"><div class="tl">Projektfortschritt</div><div class="tv">' + pct + '%</div><div class="ts">' + nDone + ' von ' + all.length + ' Aufgaben erledigt</div></div>'
    + '<div class="tile"><div class="tl">Offen</div><div class="tv">' + nOffen + '</div><div class="ts">Aufgaben</div></div>'
    + '<div class="tile"><div class="tl">In Arbeit</div><div class="tv">' + nArbeit + '</div><div class="ts">Aufgaben</div></div>'
    + '<div class="tile"><div class="tl">Risiken / Reflexion</div><div class="tv">' + nRisk + '</div><div class="ts">Karten auf der Reflexionsebene</div></div>'
    + '<div class="tile"><div class="tl">Gesamtziel</div><div class="ts" style="margin-top:4px">' + esc((state.goal||'– noch nicht definiert –').slice(0,160)) + '</div></div>'
    + '</div>';

  h += '<div class="dash-sec"><h3>Phasen &middot; Fortschritt &middot; Verantwortliche &middot; Termine <span style="font-weight:400;color:var(--muted);font-size:11px">(Zeile anklicken = Phasen-Lupe)</span></h3>'
    + '<table class="ph-tab"><tr><th>Nr.</th><th>Phase</th><th>Fortschritt</th><th></th><th>Verantwortlich</th><th>Termin</th><th>Risiken</th><th>Entscheid-Tor</th></tr>';
  state.phases.forEach((p, i) => {
    const t = tasksOfPhase(i), d = t.filter(c => c.status === 'erledigt').length;
    const ppct = t.length ? Math.round(d / t.length * 100) : 0;
    const g = gateOfPhase(i);
    h += '<tr class="dash-row" data-pi="' + i + '"><td>' + (i+1) + '</td><td><b>' + esc(p.name) + '</b></td>'
      + '<td><div class="pbar"><div style="width:' + ppct + '%"></div></div></td><td style="white-space:nowrap">' + d + '/' + t.length + '</td>'
      + '<td>' + esc(p.wer || '–') + '</td><td>' + esc(p.wann || '–') + '</td>'
      + '<td>' + cardsInPhaseLane(i, 'reflexion').length + '</td>'
      + '<td class="gate-mini">' + (g ? '&#9670; ' + esc(g.label.split(/\s[–-]\sKriterien/)[0].slice(0, 48)) : '–') + '</td></tr>';
  });
  h += '</table></div>';

  h += '<div class="dash-sec"><h3>Aufgaben-Kanban <span style="font-weight:400;color:var(--muted);font-size:11px">(Karte anklicken = Status weiterschalten)</span></h3><div class="kan">';
  [['offen','Offen','k-offen'], ['arbeit','In Arbeit','k-arbeit'], ['erledigt','Erledigt','k-erledigt']].forEach(([st, lbl, cls]) => {
    const items = all.filter(t => (t.c.status||'offen') === st);
    h += '<div class="kan-col ' + cls + '"><h4>' + lbl + ' <span class="kc">' + items.length + '</span></h4>';
    items.forEach(t => {
      h += '<div class="kan-card" data-cid="' + t.c.id + '"><span class="kp">P' + (t.i+1) + ' · ' + esc(state.phases[t.i].name.slice(0,24)) + '</span><br>' + esc(cleanTxt(t.c.text).slice(0, 110)) + '</div>';
    });
    h += '</div>';
  });
  h += '</div><div class="kan-hint">Karten stammen von der Handlungsebene der Wand. Status-Änderungen hier erscheinen sofort auch auf der Wand und in der Lupe.</div></div>';

  body.innerHTML = h;
}
document.getElementById('dashBody').addEventListener('click', e => {
  const card = e.target.closest('.kan-card');
  if (card) {
    const c = getPostit(card.dataset.cid);
    if (c) { c.status = STATUS_NEXT[c.status || 'offen']; save(); renderDash(); render(); }
    return;
  }
  const row = e.target.closest('.dash-row');
  if (row) { closeDash(); openLupe(+row.dataset.pi); }
});

/* ================================================================
   PHASEN-LUPE  – in eine Phase hineinzoomen & im Detail bearbeiten
   ================================================================ */
const STATUS_NEXT = { offen:'arbeit', arbeit:'erledigt', erledigt:'offen' };
const STATUS_LABEL = { offen:'offen', arbeit:'in Arbeit', erledigt:'erledigt' };
const LUPE_SECTIONS = [
  { lane:'handlung', title:'Aufgaben / Handlungen', add:'Aufgabe' },
  { lane:'doku',     title:'Ergebnisse / Dokumentation', add:'Ergebnis' },
  { lane:'sache',    title:'Zwischenziele', add:'Zwischenziel' },
  { lane:'reflexion',title:'Risiken & Reflexion', add:'Risiko' },
  { lane:'mgmt2',    title:'Projektleitung (Mgmt 2)', add:'Punkt' },
  { lane:'mgmt1',    title:'Bereichsleitung (Mgmt 1)', add:'Punkt' },
  { lane:'input',    title:'Experten / Input', add:'Experte' },
  { lane:'anspruch', title:'Anspruchsgruppen', add:'Gruppe' }
];
let lupeIdx = -1;

function phaseIndexOfX(x) { let acc = 0; for (let i = 0; i < state.phases.length; i++) { if (x < acc + state.phases[i].w) return i; acc += state.phases[i].w; } return state.phases.length - 1; }
function laneKeyOfY(y) { return LANE_KEYS[clamp(Math.floor(y / LANE_H), 0, LANES.length - 1)]; }
function cardsInPhaseLane(i, laneKey) { return state.postits.filter(p => phaseIndexOfX(p.x) === i && laneKeyOfY(p.y) === laneKey); }
function addCard(i, laneKey, text, status) {
  const li = LANE_KEYS.indexOf(laneKey), left = phaseLeft(i), w = state.phases[i].w;
  const n = cardsInPhaseLane(i, laneKey).length;
  const x = clamp(left + 12 + (n * 26) % Math.max(30, w - PI_W - 24), 0, canvasW(state) - PI_W);
  const y = li * LANE_H + 8 + (n * 20) % (LANE_H - 60);
  const card = { id: uid('p'), x, y, text: text || 'Neuer Eintrag', color: LANE_COLOR[laneKey] || PALETTE[0], status: status || 'offen' };
  state.postits.push(card); return card;
}

const lupe = document.getElementById('lupe'), lupeBody = document.getElementById('lupeBody');
function openLupe(i) {
  if (previewState) return;
  lupeIdx = i; lupe.style.display = 'block'; renderLupe();
}
function closeLupe() { lupe.style.display = 'none'; lupeIdx = -1; }
document.getElementById('lupeClose').onclick = closeLupe;
document.getElementById('lupePrev').onclick = () => { if (lupeIdx > 0) { lupeIdx--; renderLupe(); } };
document.getElementById('lupeNext').onclick = () => { if (lupeIdx < state.phases.length - 1) { lupeIdx++; renderLupe(); } };
lupe.addEventListener('click', e => { if (e.target === lupe) closeLupe(); });

function renderLupe() {
  const i = lupeIdx, p = state.phases[i]; if (!p) return closeLupe();
  document.getElementById('lupeTitle').textContent = p.name;
  document.getElementById('lupeNo').textContent = 'Phase ' + (i+1) + ' von ' + state.phases.length;
  const gate = state.milestones.filter(m => Math.abs(clamp(m.x,0,canvasW(state)) - (phaseLeft(i)+p.w)) < p.w*0.5);
  const eif = (k, lbl, full) => '<div class="' + (full?'full':'') + '"><label>' + lbl + '</label><textarea data-ei="' + k + '">' + esc(p[k]||'') + '</textarea></div>';
  let h = '<div class="lupe-tools">'
    + '<button class="lupe-tool" data-kind="schritte">&#129302; Schritte ergänzen</button>'
    + '<button class="lupe-tool" data-kind="risiken">&#129302; Risiken (Pre-Mortem)</button>'
    + '<button class="lupe-tool" data-kind="anspruch">&#129302; Anspruchsgruppen prüfen</button>'
    + '<button class="lupe-tool" data-kind="zusammenfassung">&#129302; Phase zusammenfassen</button>'
    + '</div>';
  h += '<div id="lupeProp"></div>';
  h += '<div class="ei-grid">' + eif('ziel','Ziel der Phase', true) + eif('input','Input') + eif('output','Output / Ergebnis') + eif('wer','Wer?') + eif('was','Was?') + eif('wann','Wann?') + eif('wie','Wie?') + '</div>';
  if (gate.length) h += '<div style="font-size:12px;color:var(--warn);margin-top:6px">&#9670; Entscheid-Tor: ' + esc(gate.map(g=>g.label).join(' | ')) + '</div>';

  LUPE_SECTIONS.forEach(sec => {
    const cards = cardsInPhaseLane(i, sec.lane);
    h += '<div class="lupe-sec"><h3>' + esc(sec.title) + ' <span class="cnt">' + cards.length + '</span><span class="add" data-addlane="' + sec.lane + '">+ ' + sec.add + '</span></h3>';
    cards.forEach(c => {
      const st = c.status || 'offen';
      h += '<div class="tk' + (st==='erledigt'?' done':'') + '" data-id="' + c.id + '">'
        + '<div class="tk-dot ' + st + '" title="Status: ' + STATUS_LABEL[st] + '"></div>'
        + '<div class="tk-text" contenteditable="true" data-id="' + c.id + '">' + esc(c.text) + '</div>'
        + (c.doc ? '<button class="tk-doc" data-id="' + c.id + '" title="Ausarbeitung als Word herunterladen">&#128229;</button>' : '')
        + '<button class="tk-ai' + (Array.isArray(c.chat) && c.chat.length ? ' has' : '') + '" data-id="' + c.id + '" title="' + (Array.isArray(c.chat) && c.chat.length ? 'Gespeicherter KI-Dialog – aufklappen' : 'KI-Unterstützung') + '">&#129302;</button>'
        + '<button class="tk-del" data-id="' + c.id + '" title="löschen">&#10005;</button></div>';
    });
    h += '</div>';
  });
  lupeBody.innerHTML = h;
}

/* Interaktion in der Lupe (Delegation) */
lupeBody.addEventListener('click', e => {
  const dot = e.target.closest('.tk-dot');
  if (dot) { const c = getPostit(dot.closest('.tk').dataset.id); if (c) { c.status = STATUS_NEXT[c.status||'offen']; save(); renderLupe(); render(); } return; }
  const del = e.target.closest('.tk-del');
  if (del) { state.postits = state.postits.filter(x => x.id !== del.dataset.id); state.connections = state.connections.filter(c => c.from !== del.dataset.id && c.to !== del.dataset.id); save(); renderLupe(); render(); return; }
  const add = e.target.closest('.add');
  if (add) { addCard(lupeIdx, add.dataset.addlane, 'Neuer Eintrag – Text bearbeiten', 'offen'); save(); renderLupe(); render(); return; }
  const dl = e.target.closest('.tk-doc');
  if (dl) { downloadCardDoc(dl.dataset.id); return; }
  const ai = e.target.closest('.tk-ai');
  if (ai) { cardAI(ai.dataset.id); return; }
  const tool = e.target.closest('.lupe-tool');
  if (tool) { phaseTool(tool.dataset.kind); return; }
});
function downloadCardDoc(id) {
  const c = getPostit(id); if (!c || !c.doc) return;
  const title = cleanTxt(c.text).slice(0, 60);
  const body = '<div style="white-space:pre-wrap;font-size:11pt;line-height:1.5">' + esc(c.doc) + '</div>';
  downloadDoc((title || 'Ausarbeitung').replace(/[\\/:*?"<>|]/g, '-') + '.doc', docShell(title || 'Ausarbeitung', body));
}
lupeBody.addEventListener('focusout', e => {
  const tx = e.target.closest('.tk-text');
  if (tx) { const c = getPostit(tx.dataset.id); if (c) { const v = tx.textContent.trim(); if (v && v !== c.text) { c.text = v; save(); render(); } } return; }
  const ei = e.target.closest('[data-ei]');
  if (ei) { const p = state.phases[lupeIdx]; if (p) { p[ei.dataset.ei] = ei.value; save(); render(); } }
});

/* KI-Dialog pro Aufgabe – Anweisungen geben, KI passt an */
async function cardAI(id) {
  const c = getPostit(id); if (!c) return;
  if (!getKey()) { openKeyModal(() => cardAI(id)); return; }
  const row = lupeBody.querySelector('.tk[data-id="' + id + '"]');
  if (!row) return;
  const existing = row.nextElementSibling;
  if (existing && existing.classList.contains('tk-ai-box')) { existing.remove(); return; } // Toggle
  const box = document.createElement('div');
  box.className = 'tk-ai-box';
  box.innerHTML = '<div class="tk-ai-msgs"></div>'
    + '<div class="tk-ai-in"><textarea rows="2" placeholder="Anweisung an die KI, z.B. «bitte Antragsformular verwenden» …"></textarea><button class="send">Senden</button></div>'
    + '<div class="row"><button class="take">Letzte Antwort als Ergebnis übernehmen</button><button class="drop">Einklappen</button><button class="wipe" style="background:#b14b46;color:#fff">Verlauf löschen</button></div>';
  row.after(box);
  const p = state.phases[lupeIdx];
  const sys = 'Du bist ein Fach-Assistent in einer Projekt-Prozesswand (Systems Engineering). Du arbeitest eine einzelne Aufgabe konkret aus und passt sie auf Anweisung des Nutzers an (z.B. bestimmte Formulare, Vorlagen, Adressaten oder Detailtiefe). Kurz, praxisnah, auf Deutsch. Kein Vorgeplänkel.';
  const dlg = Array.isArray(c.chat) ? c.chat.slice() : [];
  let lastAnswer = ''; for (let i = dlg.length - 1; i >= 0; i--) { if (dlg[i].role === 'ai') { lastAnswer = dlg[i].text; break; } }
  const msgsEl = box.querySelector('.tk-ai-msgs');
  const inEl = box.querySelector('textarea');
  const renderDlg = () => { msgsEl.innerHTML = dlg.map(m => '<div class="am ' + m.role + '">' + esc(m.text) + '</div>').join(''); msgsEl.scrollTop = msgsEl.scrollHeight; };
  const persist = think => { c.chat = dlg.filter(m => m !== think && !(m.text||'').startsWith('❌')).slice(-20); save(); };
  async function send(instr) {
    dlg.push({ role:'user', text: instr }); const think = { role:'ai', text:'… denkt nach …' }; dlg.push(think); renderDlg();
    try {
      const hist = 'Projektziel: ' + (state.goal||'-') + '\nPhase: ' + p.name + '\nAufgabe: "' + c.text + '"\n\n'
        + dlg.filter(m => m !== think).map(m => (m.role==='user' ? 'Anweisung: ' : 'Assistent: ') + m.text).join('\n\n');
      const out = await callClaude(sys, hist, CHAT_MODEL, 1100);
      dlg.splice(dlg.indexOf(think), 1); dlg.push({ role:'ai', text: out }); lastAnswer = out; renderDlg(); persist();
    } catch (e) { dlg.splice(dlg.indexOf(think), 1); dlg.push({ role:'ai', text:'❌ ' + e.message }); renderDlg(); persist(); }
  }
  box.querySelector('.send').onclick = () => { const v = inEl.value.trim(); if (!v) return; inEl.value = ''; send(v); };
  inEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); box.querySelector('.send').click(); } });
  box.querySelector('.drop').onclick = () => { box.remove(); renderLupe(); };
  box.querySelector('.wipe').onclick = () => {
    if (!box.dataset.arm) { box.dataset.arm = '1'; box.querySelector('.wipe').textContent = 'Wirklich löschen?'; return; }
    delete c.chat; save(); box.remove(); renderLupe();
  };
  box.querySelector('.take').onclick = () => {
    if (!lastAnswer) return;
    const first = lastAnswer.split('\n').find(l => l.trim()) || lastAnswer;
    const nc = addCard(lupeIdx, 'doku', '📄 ' + first.slice(0, 140).replace(/^[-•#\d.\s]+/, ''), 'offen');
    nc.doc = lastAnswer; // kompletter Text bleibt in der Karte gespeichert
    save(); renderLupe(); render();
    sysMsg('📄 Ausarbeitung auf der Dokumentationsebene gespeichert – Download über das 📥-Symbol in der Lupe.', true);
  };
  renderDlg();
  if (!dlg.length) send('Bitte diese Aufgabe konkret ausarbeiten: Teilschritte, erwartetes Ergebnis, worauf achten.');
}

/* Phasen-Analyse-Tools (mit Freigabe) */
async function phaseTool(kind) {
  const prop = document.getElementById('lupeProp');
  const p = state.phases[lupeIdx];
  document.querySelectorAll('.lupe-tool').forEach(b => b.disabled = true);
  if (!getKey()) { document.querySelectorAll('.lupe-tool').forEach(b => b.disabled = false); openKeyModal(() => phaseTool(kind)); return; }
  const ctx = 'Projektziel: ' + (state.goal||'-') + '\nPhase ' + (lupeIdx+1) + ': ' + p.name
    + '\nBereits vorhanden – Schritte: ' + cardsInPhaseLane(lupeIdx,'handlung').map(c=>c.text).join('; ')
    + ' | Risiken: ' + cardsInPhaseLane(lupeIdx,'reflexion').map(c=>c.text).join('; ')
    + ' | Anspruchsgruppen: ' + cardsInPhaseLane(lupeIdx,'anspruch').map(c=>c.text).join('; ');
  try {
    if (kind === 'zusammenfassung') {
      prop.style.display = 'block'; prop.innerHTML = '🤖 fasst zusammen …';
      const out = await callClaude('Du bist Projektmoderator. Fasse den Stand dieser Phase in 4–6 Sätzen zusammen: Ziel, Vorgehen, offene Punkte, Risiken. Deutsch, sachlich.', ctx + '\n\n' + wallContext(), CHAT_MODEL, 700);
      prop.innerHTML = '<h4>Zusammenfassung Phase ' + (lupeIdx+1) + '</h4><div style="font-size:12.5px;white-space:pre-wrap">' + esc(out) + '</div><div class="row"><button class="drop">Schliessen</button></div>';
      prop.querySelector('.drop').onclick = () => { prop.style.display = 'none'; };
      return;
    }
    const cfgKind = {
      schritte:  { lane:'handlung', label:'Schritte / Aufgaben', prefix:'', sys:'Nenne bis zu 5 zusätzliche, konkrete Arbeitsschritte für diese Phase, die noch fehlen. Keine Wiederholungen.' },
      risiken:   { lane:'reflexion', label:'Risiken (Pre-Mortem)', prefix:'⚠️ ', sys:'Führe ein Pre-Mortem durch: nenne bis zu 5 konkrete Risiken/Fehlerquellen dieser Phase, die noch nicht genannt sind.' },
      anspruch:  { lane:'anspruch', label:'Anspruchsgruppen', prefix:'👥 ', sys:'Nenne bis zu 5 betroffene oder fehlende Anspruchsgruppen/Stakeholder dieser Phase, die noch nicht genannt sind.' }
    }[kind];
    prop.style.display = 'block'; prop.innerHTML = '🤖 erarbeitet Vorschläge …';
    const data = await (async () => {
      const sys = cfgKind.sys + '\nAntworte AUSSCHLIESSLICH als JSON: {"items":["...","..."]}';
      const t = await callClaude(sys, ctx, CHAT_MODEL, 800);
      return extractJSON(t);
    })();
    const items = (data.items || []).filter(x => typeof x === 'string' && x.trim()).slice(0, 6);
    if (!items.length) { prop.innerHTML = '<h4>Keine neuen Vorschläge.</h4><div class="row"><button class="drop">Schliessen</button></div>'; prop.querySelector('.drop').onclick = () => prop.style.display='none'; return; }
    prop.innerHTML = '<h4>Vorschläge: ' + cfgKind.label + ' (auswählen &amp; übernehmen)</h4>'
      + items.map((t, j) => '<label><input type="checkbox" checked data-j="' + j + '"><span>' + esc(t) + '</span></label>').join('')
      + '<div class="row"><button class="take">Übernehmen</button><button class="drop">Verwerfen</button></div>';
    prop.querySelector('.drop').onclick = () => { prop.style.display = 'none'; };
    prop.querySelector('.take').onclick = () => {
      prop.querySelectorAll('input[type=checkbox]').forEach(cb => { if (cb.checked) addCard(lupeIdx, cfgKind.lane, cfgKind.prefix + items[+cb.dataset.j], 'offen'); });
      prop.style.display = 'none'; save(); renderLupe(); render();
    };
  } catch (e) {
    prop.style.display = 'block'; prop.innerHTML = '❌ ' + esc(e.message) + '<div class="row"><button class="drop">Schliessen</button></div>';
    prop.querySelector('.drop').onclick = () => prop.style.display = 'none';
  } finally {
    document.querySelectorAll('.lupe-tool').forEach(b => b.disabled = false);
  }
}

/* ---------- Supabase: Konten & Cloud-Speicher ---------- */
async function loadFromCloud() {
  try {
    const { data, error } = await sb.from('walls').select('data').eq('user_id', currentUser.id).maybeSingle();
    if (error) throw error;
    loadCollection(data && data.data);
    sysMsg('Willkommen! ' + collection.boards.length + ' Prozesswand(-wände) geladen. Oben links wechseln oder «Wände…» verwalten.', true);
  } catch (e) {
    loadCollection(null);
    sysMsg('Cloud-Laden fehlgeschlagen: ' + (e.message || e), true);
  }
}
async function cloudSave() {
  if (!sb || !currentUser) return;
  syncActive();
  try {
    const { error } = await sb.from('walls').upsert({ user_id: currentUser.id, data: collection, updated_at: new Date().toISOString() });
    if (error) throw error;
  } catch (e) { /* lokale Kopie bleibt erhalten */ }
}
function scheduleCloudSave() {
  if (!sb || !currentUser) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(cloudSave, 1500);
}

/* ---------- Auth-Gate ---------- */
const authGate = document.getElementById('authGate');
function showAuth(msg) {
  authGate.style.display = 'flex';
  if (msg !== undefined) document.getElementById('authErr').textContent = msg;
}
async function startApp(user) {
  currentUser = user;
  document.getElementById('userTag').textContent = user.email || '';
  document.getElementById('logoutBtn').style.display = '';
  authGate.style.display = 'none';
  await loadFromCloud();
}
async function initAuth() {
  if (!window.supabase) {
    let local = null; try { local = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
    loadCollection(local);
    showAuth('Keine Verbindung zum Anmelde-Dienst. Internetverbindung prüfen und Seite neu laden.');
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  loadCollection(null);
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) { startApp(data.session.user); return; }
  } catch (e) {}
  showAuth('');
}
document.getElementById('authSubmit').onclick = async () => {
  const email = document.getElementById('authEmail').value.trim();
  const pw = document.getElementById('authPw').value;
  const err = document.getElementById('authErr');
  err.textContent = '';
  if (!sb) { err.textContent = 'Keine Verbindung zum Anmelde-Dienst.'; return; }
  if (!email || !pw) { err.textContent = 'Bitte E-Mail und Passwort eingeben.'; return; }
  const register = document.getElementById('authForm').dataset.mode === 'register';
  try {
    if (register) {
      const { data, error } = await sb.auth.signUp({ email, password: pw });
      if (error) throw error;
      if (data.session) startApp(data.session.user);
      else err.textContent = 'Konto erstellt – bitte E-Mail bestätigen, dann anmelden.';
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
      startApp(data.user);
    }
  } catch (e) { err.textContent = e.message || String(e); }
};
document.getElementById('authToggle').onclick = () => {
  const f = document.getElementById('authForm');
  const toRegister = f.dataset.mode !== 'register';
  f.dataset.mode = toRegister ? 'register' : 'login';
  document.getElementById('authTitle').textContent = toRegister ? 'Konto erstellen' : 'Anmelden';
  document.getElementById('authSubmit').textContent = toRegister ? 'Registrieren' : 'Anmelden';
  document.getElementById('authToggle').textContent = toRegister ? 'Schon ein Konto? Anmelden' : 'Neues Konto erstellen';
  document.getElementById('authErr').textContent = '';
};
document.getElementById('authPw').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('authSubmit').click();
});
document.getElementById('logoutBtn').onclick = async () => {
  try { if (sb) await sb.auth.signOut(); } catch (e) {}
  location.reload();
};

/* ---------- Start ---------- */
document.getElementById('verTag').textContent = APP_VERSION;
document.title = 'OSTO/SYMA Prozesswand ' + APP_VERSION;
initAuth();
</script>
