<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSTO/SYMA Prozesswand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --line:#d9dde3; --muted:#6b7280; --accent:#3f6fb0; --bg:#eef0f3; --ok:#2f8a4c; --warn:#b14b46; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { font:13px/1.45 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#1d2530; background:var(--bg); display:flex; flex-direction:column; }

header { display:flex; align-items:center; gap:8px; padding:8px 14px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1 { font-size:16px; margin:0 6px 0 0; }
header .sub { font-size:11px; color:var(--muted); margin-right:auto; }
header button { font:inherit; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--line); border-radius:6px; background:#f6f7f9; padding:6px 11px; }
header button:hover { background:#eceef2; }
header button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
header button.primary:hover { background:#355f97; }
header button.active { background:#e3ecf7; border-color:var(--accent); color:var(--accent); }
.savedTag { font-size:11px; color:var(--ok); min-width:70px; text-align:right; }
.userTag { font-size:11px; color:var(--muted); }

#main { flex:1; display:flex; min-height:0; }
#wallScroll { flex:1; overflow:auto; position:relative; }
#wallCanvas { position:relative; background:#fff; }

.lane-label { position:absolute; left:0; width:150px; padding:8px 10px; border-right:2px solid #c3c9d1; border-bottom:1px solid var(--line); background:#f8f9fb; z-index:5; cursor:default; }
.lane-label b { display:block; font-size:11.5px; }
.lane-label span { display:block; font-size:10px; color:var(--muted); margin-top:2px; line-height:1.3; }
.lane-row { position:absolute; border-bottom:1px solid var(--line); z-index:1; }
.lane-row.alt { background:#fbfcfd; }

.phase-head { position:absolute; top:0; height:60px; background:#f2f5f9; border-right:1px solid var(--line); border-bottom:2px solid #c3c9d1; padding:8px 10px; z-index:8; cursor:pointer; overflow:hidden; }
.phase-head:hover { background:#e9eef5; }
.phase-head b { font-size:12px; display:block; }
.phase-head small { font-size:10px; color:var(--muted); }
.phase-resize { position:absolute; top:0; bottom:0; right:-4px; width:9px; cursor:ew-resize; z-index:9; }
.phase-resize:hover { background:rgba(63,111,176,.3); }
.phase-sep { position:absolute; width:0; border-left:1px dashed #ccd3dc; z-index:2; pointer-events:none; }

.postit { position:absolute; width:172px; min-height:52px; padding:7px 9px; font-size:11.5px; line-height:1.35; border-radius:6px; box-shadow:0 2px 5px rgba(0,0,0,.18); cursor:grab; z-index:12; white-space:pre-wrap; word-wrap:break-word; user-select:none; }
.postit:active { cursor:grabbing; }
.postit.sel { outline:3px solid var(--accent); }
.postit.dim { opacity:.55; }

.ms-line { position:absolute; width:0; border-left:2px dashed #b3543f; z-index:6; pointer-events:none; }
.ms-flag { position:absolute; transform:translateX(-50%); background:#b3543f; color:#fff; font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:5px; z-index:14; cursor:grab; white-space:nowrap; max-width:200px; overflow:hidden; text-overflow:ellipsis; box-shadow:0 1px 4px rgba(0,0,0,.25); }

#conns { position:absolute; left:0; top:0; z-index:11; pointer-events:none; }
#conns path.vis { fill:none; stroke:#3a4a5e; stroke-width:1.8; marker-end:url(#arr); }
#conns path.hit { fill:none; stroke:rgba(0,0,0,0); stroke-width:14; }
body.connect #conns path.hit { pointer-events:stroke; cursor:pointer; }

aside { width:332px; background:#fff; border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.ki-head { padding:9px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
.ki-head b { font-size:13px; }
.ki-head button { margin-left:auto; font:inherit; font-size:11px; cursor:pointer; border:1px solid var(--line); border-radius:5px; background:#f6f7f9; padding:3px 8px; }
#kiLog { flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
.msg { max-width:95%; padding:7px 10px; border-radius:8px; font-size:12px; white-space:pre-wrap; word-wrap:break-word; }
.msg.user { align-self:flex-end; background:#e3ecf7; }
.msg.ai { align-self:flex-start; background:#f1f2f5; }
.msg.sys { align-self:center; background:none; color:var(--muted); font-size:11px; text-align:center; }
.ki-foot { border-top:1px solid var(--line); padding:8px; }
#chatRow { display:flex; gap:6px; }
#chatInput { flex:1; font:inherit; font-size:12px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; resize:none; }
#sendBtn { font:inherit; font-size:12px; font-weight:600; cursor:pointer; border:0; border-radius:6px; background:var(--accent); color:#fff; padding:0 14px; }

#goalbar { display:flex; align-items:center; gap:10px; padding:8px 14px; background:#fff; border-top:1px solid var(--line); box-shadow:0 -1px 4px rgba(0,0,0,.06); }
#goalbar label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); white-space:nowrap; }
#goalInput { flex:1; font:inherit; font-size:13px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; resize:none; min-height:34px; line-height:1.35; }
#smartBtn { font:inherit; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; border:0; border-radius:6px; background:var(--accent); color:#fff; padding:8px 14px; }
#smartBtn:hover { background:#355f97; }

#overlay { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(20,28,40,.45); }
.modal { background:#fff; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.25); width:430px; max-width:94vw; max-height:88vh; overflow-y:auto; padding:18px 20px; }
.modal h3 { margin:0 0 12px; font-size:15px; }
.modal label { display:block; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin:10px 0 3px; }
.modal input[type=text], .modal input[type=password], .modal textarea, .modal select { width:100%; font:inherit; font-size:13px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; resize:vertical; }
.modal .btnrow { display:flex; gap:8px; margin-top:16px; }
.modal .btnrow button { font:inherit; font-size:13px; font-weight:600; cursor:pointer; border-radius:7px; padding:8px 14px; border:1px solid var(--line); background:#f6f7f9; }
.modal .btnrow .go { background:var(--accent); border-color:var(--accent); color:#fff; }
.modal .btnrow .del { color:var(--warn); margin-left:auto; }
.swatches { display:flex; gap:7px; margin-top:4px; }
.swatch { width:30px; height:30px; border-radius:6px; cursor:pointer; border:2px solid rgba(0,0,0,.12); }
.swatch.sel { border-color:#1d2530; }
.modal.wide { width:820px; max-width:96vw; }
.ei-sub { font-size:12.5px; color:var(--muted); line-height:1.45; margin:2px 0 14px; }
.ei-ziel-big { width:100%; font:inherit; font-size:13px; line-height:1.45; padding:9px 11px; border:1px solid var(--line); border-radius:7px; resize:none; overflow:hidden; background:#fffef6; min-height:46px; }
.ei-wrap { display:grid; grid-template-columns:1fr 28px 1.55fr 28px 1fr; align-items:stretch; gap:6px; margin-top:8px; }
.ei-col { display:flex; flex-direction:column; }
.ei-col > label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin-bottom:5px; }
.ei-in > label, .ei-out > label { color:#3f6fb0; }
.ei-col textarea { width:100%; font:inherit; font-size:13px; line-height:1.45; padding:9px 11px; border:1px solid var(--line); border-radius:7px; resize:none; overflow:hidden; }
.ei-in textarea, .ei-out textarea { background:#f6f9fd; flex:1; min-height:170px; }
.ei-flow { align-self:center; text-align:center; color:var(--accent); font-size:24px; font-weight:700; }
.ei-egg { border:2.5px solid var(--accent); border-radius:46% / 11%; background:linear-gradient(#f5f9ff,#e9f1fb); padding:24px 30px; }
.ei-egg .ei-egg-h { text-align:center; font-size:12.5px; font-weight:700; letter-spacing:.5px; color:var(--accent); margin-bottom:14px; }
.ei-w { display:flex; flex-direction:column; gap:13px; }
.ei-w label { display:block; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:4px; }
.ei-w textarea { background:#fffef6; min-height:40px; }

#previewBar { position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:55; display:none; align-items:center; gap:10px; background:#233247; color:#fff; padding:10px 16px; border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.35); }
#previewBar b { font-size:13px; }
#previewBar button { font:inherit; font-size:12px; font-weight:700; cursor:pointer; border:0; border-radius:6px; padding:7px 12px; }
#pvNeu { background:#7a5cc4; color:#fff; }
#pvErsetzen { background:#3fa564; color:#fff; }
#pvErgaenzen { background:#4a7fc4; color:#fff; }
#pvVerwerfen { background:#6b7a8d; color:#fff; }
#boardSelect { font:inherit; font-size:12px; font-weight:600; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#f6f7f9; max-width:220px; cursor:pointer; }
.brd-row { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); }
.brd-row input { flex:1; font:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
.brd-row button { font:inherit; font-size:11.5px; cursor:pointer; border:1px solid var(--line); border-radius:5px; background:#f6f7f9; padding:5px 9px; }
.brd-row button:hover { background:#eceef2; }
.brd-row .brd-del { color:var(--warn); }
.brd-row.active input { border-color:var(--accent); background:#f2f7ff; font-weight:600; }

#authGate { position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center; background:var(--bg); }
.auth-card { background:#fff; padding:28px 30px; border-radius:12px; box-shadow:0 4px 22px rgba(0,0,0,.14); width:312px; }
.auth-card h2 { margin:0 0 4px; font-size:17px; }
.auth-card p { margin:0 0 16px; font-size:12px; color:var(--muted); line-height:1.4; }
.auth-card input { width:100%; font:inherit; font-size:14px; padding:9px 10px; border:1px solid var(--line); border-radius:7px; margin-bottom:9px; }
#authSubmit { width:100%; font:inherit; font-size:14px; font-weight:700; cursor:pointer; border:0; border-radius:7px; background:var(--accent); color:#fff; padding:10px; }
.auth-card .link { display:block; margin:12px auto 0; font-size:12px; color:var(--accent); background:none; border:0; cursor:pointer; }
.auth-err { color:var(--warn); font-size:12px; min-height:16px; margin-top:8px; text-align:center; }

/* ---- Status-Punkt auf Post-its (Hauptwand) ---- */
.postit .dot { position:absolute; top:5px; right:6px; width:10px; height:10px; border-radius:50%; border:1.5px solid rgba(0,0,0,.25); }
.dot.offen { background:#cfd5dd; } .dot.arbeit { background:#3f6fb0; } .dot.erledigt { background:#2f8a4c; }
.postit.st-erledigt { opacity:.72; }
.phase-zoom { position:absolute; top:6px; right:6px; z-index:10; font-size:12px; line-height:1; border:1px solid var(--line); border-radius:5px; background:#fff; cursor:pointer; padding:3px 5px; }
.phase-zoom:hover { background:#e3ecf7; border-color:var(--accent); }

/* ---- Phasen-Lupe ---- */
#lupe { position:fixed; inset:0; z-index:70; display:none; background:rgba(20,28,40,.5); }
#lupe .lupe-inner { position:absolute; inset:24px; background:#fff; border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.35); display:flex; flex-direction:column; overflow:hidden; }
.lupe-top { display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid var(--line); background:#f6f8fb; }
.lupe-top h2 { margin:0; font-size:16px; } .lupe-top .ph-no { font-size:11px; color:var(--muted); }
.lupe-top .sp { margin-left:auto; }
.lupe-top button { font:inherit; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--line); border-radius:6px; background:#fff; padding:6px 10px; }
.lupe-top button:hover { background:#eceef2; }
.lupe-top .lupe-close { background:var(--accent); color:#fff; border-color:var(--accent); }
.lupe-body { flex:1; overflow-y:auto; padding:16px 18px; }
.lupe-tools { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.lupe-tools button { font:inherit; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--accent); color:var(--accent); border-radius:16px; background:#eef4fb; padding:6px 12px; }
.lupe-tools button:hover { background:#dfeaf7; }
.lupe-tools button:disabled { opacity:.5; cursor:default; }
.ei-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-bottom:8px; }
.ei-grid .full { grid-column:1 / -1; }
.ei-grid label { display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin-bottom:2px; }
.ei-grid textarea { width:100%; font:inherit; font-size:12.5px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; resize:vertical; min-height:38px; }
.lupe-sec { margin-top:18px; border-top:1px solid var(--line); padding-top:12px; }
.lupe-sec h3 { margin:0 0 8px; font-size:13px; display:flex; align-items:center; gap:8px; }
.lupe-sec h3 .cnt { font-size:11px; color:var(--muted); font-weight:400; }
.lupe-sec h3 .add { margin-left:auto; font-size:11px; font-weight:600; cursor:pointer; border:1px dashed var(--line); border-radius:6px; background:#fafbfc; padding:3px 9px; color:var(--accent); }
.tk { display:flex; align-items:flex-start; gap:9px; padding:7px 9px; border:1px solid var(--line); border-radius:8px; margin-bottom:7px; background:#fff; }
.tk .tk-dot { flex:none; margin-top:2px; width:15px; height:15px; border-radius:50%; border:2px solid #cfd5dd; cursor:pointer; }
.tk .tk-dot.arbeit { background:#3f6fb0; border-color:#3f6fb0; } .tk .tk-dot.erledigt { background:#2f8a4c; border-color:#2f8a4c; }
.tk .tk-text { flex:1; font-size:12.5px; line-height:1.4; outline:none; min-height:18px; }
.tk .tk-text:focus { background:#fffdf0; }
.tk.done .tk-text { text-decoration:line-through; color:var(--muted); }
.tk button { flex:none; font-size:12px; cursor:pointer; border:1px solid var(--line); border-radius:5px; background:#f6f7f9; padding:2px 6px; }
.tk button:hover { background:#e9ecf1; }
.tk-ai-box { margin:0 0 9px 24px; padding:9px 11px; border-left:3px solid var(--accent); background:#f2f7fc; border-radius:0 8px 8px 0; font-size:12px; white-space:pre-wrap; }
.tk-ai-box .row { margin-top:8px; display:flex; gap:8px; }
.tk-ai-box button { font:inherit; font-size:11.5px; font-weight:600; cursor:pointer; border:0; border-radius:6px; padding:5px 10px; }
.tk-ai-box .take { background:#2f8a4c; color:#fff; } .tk-ai-box .drop { background:#6b7a8d; color:#fff; }
#lupeProp { margin:12px 0; padding:12px 14px; border:1px solid var(--accent); border-radius:10px; background:#f2f7fc; display:none; }
#lupeProp h4 { margin:0 0 8px; font-size:12.5px; }
#lupeProp label { display:flex; gap:8px; align-items:flex-start; font-size:12.5px; margin-bottom:6px; cursor:pointer; }
#lupeProp .row { margin-top:10px; display:flex; gap:8px; }
#lupeProp .row button { font:inherit; font-size:12px; font-weight:600; cursor:pointer; border:0; border-radius:6px; padding:6px 12px; }
#lupeProp .take { background:#2f8a4c; color:#fff; } #lupeProp .drop { background:#6b7a8d; color:#fff; }

/* KI-Dialog pro Aufgabe (hell) */
.tk-ai-msgs { max-height:320px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
.tk-ai-msgs .am { padding:7px 10px; border-radius:8px; font-size:12.5px; line-height:1.45; white-space:pre-wrap; max-width:92%; }
.tk-ai-msgs .am.user { align-self:flex-end; background:#e3ecf7; }
.tk-ai-msgs .am.ai { align-self:flex-start; background:#f1f2f5; }
.tk-ai-in { display:flex; gap:6px; margin-top:9px; }
.tk-ai-in textarea { flex:1; font:inherit; font-size:12.5px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; resize:vertical; min-height:38px; }
.tk-ai-in .send { font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; border:0; border-radius:6px; background:var(--accent); color:#fff; padding:0 14px; }
</style>
</head>
<body>

<header>
  <h1>OSTO/SYMA Prozesswand</h1>
  <select id="boardSelect" title="Prozesswand wählen"></select>
  <button id="boardMenu" title="Wände verwalten">W&auml;nde&hellip;</button>
  <span class="sub">Phase = System-Ei &middot; Doppelklick = Post-it</span>
  <span class="userTag" id="userTag"></span>
  <button id="logoutBtn" style="display:none">Abmelden</button>
  <span class="savedTag" id="savedTag"></span>
  <button id="swarmBtn" class="primary">&#129302; KI-Struktur</button>
  <button id="undoBtn" style="display:none">R&uuml;ckg&auml;ngig</button>
  <button id="addPhase">+ Phase</button>
  <button id="addMs">+ Meilenstein</button>
  <button id="connectBtn">Verbinden</button>
  <button id="docsBtn">Dokumente</button>
  <button id="exportBtn">Export</button>
  <button id="importBtn">Import</button>
  <input type="file" id="importFile" accept=".json" style="display:none">
</header>

<div id="main">
  <div id="wallScroll"><div id="wallCanvas"></div></div>
  <aside>
    <div class="ki-head"><b>&#129302; KI-Moderator</b><button id="keyBtn">API-Schl&uuml;ssel</button></div>
    <div id="kiLog"></div>
    <div class="ki-foot">
      <div id="chatRow">
        <textarea id="chatInput" rows="2" placeholder="Frage an den KI-Moderator..."></textarea>
        <button id="sendBtn">Senden</button>
      </div>
    </div>
  </aside>
</div>

<div id="goalbar">
  <label>Gesamtziel</label>
  <textarea id="goalInput" rows="1" placeholder="Was soll am Ende des Projekts erreicht sein? (SMART)"></textarea>
  <button id="smartBtn">SMART-Check</button>
</div>

<div id="previewBar">
  <b>Vorschau des KI-Entwurfs</b>
  <button id="pvNeu">Als neue Wand</button>
  <button id="pvErsetzen">Wand ersetzen</button>
  <button id="pvErgaenzen">Erg&auml;nzen</button>
  <button id="pvVerwerfen">Verwerfen</button>
</div>

<div id="overlay"><div class="modal" id="modalBox"></div></div>

<div id="lupe"><div class="lupe-inner">
  <div class="lupe-top">
    <div><h2 id="lupeTitle">Phase</h2><div class="ph-no" id="lupeNo"></div></div>
    <span class="sp"></span>
    <button id="lupePrev" title="vorige Phase">&#8592;</button>
    <button id="lupeNext" title="nächste Phase">&#8594;</button>
    <button class="lupe-close" id="lupeClose">Schliessen</button>
  </div>
  <div class="lupe-body" id="lupeBody"></div>
</div></div>

<div id="authGate">
  <div class="auth-card" id="authForm" data-mode="login">
    <h2 id="authTitle">Anmelden</h2>
    <p>OSTO/SYMA Prozesswand &ndash; bitte anmelden, um deine Wand zu laden.</p>
    <input type="email" id="authEmail" placeholder="E-Mail" autocomplete="username">
    <input type="password" id="authPw" placeholder="Passwort" autocomplete="current-password">
    <button id="authSubmit">Anmelden</button>
    <button class="link" id="authToggle">Neues Konto erstellen</button>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

];
const LANE_KEYS = LANES.map(l => l.key);
const PALETTE = ['#fdf3bf','#ffd9e0','#cdeccd','#d2e4f5','#e7e3ef'];
const LANE_COLOR = { reflexion:'#ffd9e0', input:'#fdf3bf', mgmt1:'#d2e4f5', mgmt2:'#d2e4f5', sache:'#fdf3bf', handlung:'#cdeccd', doku:'#e7e3ef', anspruch:'#ffd9e0' };

const LABEL_W = 150, HEADER_H = 60, LANE_H = 104, PHASE_W = 300, PI_W = 172;
const STORE = 'osto-prozesswand-v3';

/* ---------- Zustand ---------- */
let state, previewState = null, previewMeta = null;
let convo = [];
let connectMode = false, connectSrc = null;
let undoBackup = null;
let sb = null, currentUser = null, cloudTimer = null;
let collection = { boards: [], activeId: null };

function defaultState() {
  const phases = [
    'Auftrags- & Situationsanalyse', 'Zielanalyse', 'Lösungskonzept / Synthese',
    'Bewertung & Entscheid', 'Umsetzung', 'Kontrolle & Feedback'
  ].map(n => ({ id: uid('ph'), name: n, w: PHASE_W, ziel:'', input:'', output:'', wer:'', was:'', wann:'', wie:'' }));
  const laneY = k => LANE_KEYS.indexOf(k) * LANE_H + 14;
  const phaseX = i => i * PHASE_W + (PHASE_W - PI_W) / 2;
  const a = { id: uid('p'), x: phaseX(1), y: laneY('sache'), text: 'Beispiel: Post-it anfassen und frei in der Zeit verschieben.', color: PALETTE[3] };
  const b = { id: uid('p'), x: phaseX(2), y: laneY('handlung'), text: 'Beispiel: über «Verbinden» entsteht der Netzplan.', color: PALETTE[2] };
  return {
    goal: '', phases,
    postits: [a, b],
    connections: [{ id: uid('c'), from: a.id, to: b.id }],
    milestones: [{ id: uid('m'), x: 3 * PHASE_W, label: 'Konzept-Entscheid' }],
    laneTitles: {}
  };
}
function uid(p) { return (p||'i') + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function clamp(v,a,b) { return Math.max(a, Math.min(b, v)); }
function activeState() { return previewState || state; }

function normalizeState(d) {
  const s = {
    goal: d.goal || '',
    phases: Array.isArray(d.phases) ? d.phases : [],
    postits: Array.isArray(d.postits) ? d.postits : [],
    connections: Array.isArray(d.connections) ? d.connections : [],
    milestones: Array.isArray(d.milestones) ? d.milestones : [],
    laneTitles: d.laneTitles || {},
    kiLog: Array.isArray(d.kiLog) ? d.kiLog : [],
    kiConvo: Array.isArray(d.kiConvo) ? d.kiConvo : []
  };
  s.phases.forEach(p => { if (typeof p.w !== 'number' || p.w < 80) p.w = PHASE_W; });
  return s;
}
/* ---------- Sammlung mehrerer Prozesswände (Boards) ---------- */
function activeBoard() { return collection.boards.find(b => b.id === collection.activeId) || collection.boards[0] || null; }
function syncActive() { const b = activeBoard(); if (b) b.state = state; }
function refreshFromState() {
  goalInput.value = state.goal || ''; autoResizeGoal(); render();
  kiLog.innerHTML = '';
  convo = Array.isArray(state.kiConvo) ? state.kiConvo.slice() : [];
  (Array.isArray(state.kiLog) ? state.kiLog : []).forEach(m => addMsg(m.cls, m.text, { restore: true }));
}
function activateBoard(id) {
  if (id) collection.activeId = id;
  let b = activeBoard();
  if (!b) { b = { id: uid('b'), name: 'Meine Wand', state: defaultState() }; collection.boards.push(b); collection.activeId = b.id; }
  collection.activeId = b.id; state = b.state;
  renderBoardSelect(); refreshFromState();
}
function newBoardFrom(name, st, activate) {
  const b = { id: uid('b'), name: name || 'Neue Wand', state: st || defaultState() };
  collection.boards.push(b);
  if (activate !== false) { collection.activeId = b.id; state = b.state; renderBoardSelect(); refreshFromState(); }
  save();
  return b;
}
function loadCollection(d) {
  collection = { boards: [], activeId: null };
  if (d && Array.isArray(d.boards) && d.boards.length) {
    collection.boards = d.boards.map(b => ({ id: b.id || uid('b'), name: b.name || 'Wand', state: normalizeState(b.state || {}) }));
    collection.activeId = d.activeId || collection.boards[0].id;
  } else if (d && Array.isArray(d.phases) && d.phases.length) {
    const b = { id: uid('b'), name: 'Meine Wand', state: normalizeState(d) }; collection.boards = [b]; collection.activeId = b.id;
  } else {
    const b = { id: uid('b'), name: 'Meine Wand', state: defaultState() }; collection.boards = [b]; collection.activeId = b.id;
  }
  if (!collection.boards.find(b => b.id === collection.activeId)) collection.activeId = collection.boards[0].id;
  activateBoard(collection.activeId);
}
function renderBoardSelect() {
  const sel = document.getElementById('boardSelect'); if (!sel) return;
  sel.innerHTML = collection.boards.map(b => '<option value="' + b.id + '"' + (b.id === collection.activeId ? ' selected' : '') + '>' + esc(b.name) + '</option>').join('');
}

function save() {
  syncActive();
  localStorage.setItem(STORE, JSON.stringify(collection));
  const t = document.getElementById('savedTag');
  t.textContent = 'gespeichert'; setTimeout(() => { t.textContent = ''; }, 1300);
  scheduleCloudSave();
}

/* ---------- Geometrie ---------- */
function canvasW(s) { s = s || activeState(); return Math.max(600, s.phases.reduce((t, p) => t + p.w, 0)); }
function phaseLeft(i, s) { s = s || activeState(); let x = 0; for (let k = 0; k < i && k < s.phases.length; k++) x += s.phases[k].w; return x; }
function canvasH() { return LANES.length * LANE_H; }
function laneTitle(l) { return activeState().laneTitles[l.key] || l.title; }
function getPostit(id) { return activeState().postits.find(p => p.id === id); }

/* ---------- Rendering ---------- */
const canvas = document.getElementById('wallCanvas');
function render() {
  const s = activeState();
  const W = canvasW(s), H = canvasH();
  canvas.style.width = (LABEL_W + W) + 'px';
  canvas.style.height = (HEADER_H + H) + 'px';
  let h = '';

  LANES.forEach((l, i) => {
    h += '<div class="lane-row' + (i % 2 ? ' alt' : '') + '" data-laneidx="' + i + '" style="left:' + LABEL_W + 'px;top:' + (HEADER_H + i*LANE_H) + 'px;width:' + W + 'px;height:' + LANE_H + 'px"></div>';
    h += '<div class="lane-label" data-lane="' + l.key + '" style="top:' + (HEADER_H + i*LANE_H) + 'px;height:' + LANE_H + 'px"><b>' + esc(laneTitle(l)) + '</b><span>' + esc(l.desc) + '</span></div>';
  });

  s.phases.forEach((p, i) => {
    const left = LABEL_W + phaseLeft(i, s);
    h += '<div class="phase-head" data-pi="' + i + '" style="left:' + left + 'px;width:' + p.w + 'px"><b>' + esc(p.name) + '</b><small>Phase ' + (i+1) + ' · klicken = System-Ei</small><button class="phase-zoom" data-zi="' + i + '" title="Phasen-Lupe: im Detail bearbeiten">&#128269;</button><div class="phase-resize" data-ri="' + i + '"></div></div>';
    if (i > 0) h += '<div class="phase-sep" style="left:' + left + 'px;top:' + HEADER_H + 'px;height:' + H + 'px"></div>';
  });

  const flagTop = HEADER_H + LANE_KEYS.indexOf('sache') * LANE_H + 3;
  s.milestones.forEach(m => {
    const x = LABEL_W + clamp(m.x, 0, W);
    const short = (m.label || '').split(/\s[–-]\sKriterien/)[0];
    h += '<div class="ms-line" style="left:' + x + 'px;top:' + HEADER_H + 'px;height:' + H + 'px"></div>';
    h += '<div class="ms-flag" data-mid="' + m.id + '" style="left:' + x + 'px;top:' + flagTop + 'px" title="' + esc(m.label) + '">&#9670; ' + esc(short) + '</div>';
  });

  s.postits.forEach(p => {
    const st = p.status || 'offen';
    h += '<div class="postit st-' + st + (connectSrc === p.id ? ' sel' : '') + '" data-pid="' + p.id + '" style="left:' + (LABEL_W + p.x) + 'px;top:' + (HEADER_H + p.y) + 'px;background:' + (p.color || PALETTE[0]) + '"><span class="dot ' + st + '"></span>' + esc(p.text) + '</div>';
  });

  h += '<svg id="conns" width="' + (LABEL_W + W) + '" height="' + (HEADER_H + H) + '"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4a5e"/></marker></defs>';
  s.connections.forEach(c => {
    const a = s.postits.find(p => p.id === c.from), b = s.postits.find(p => p.id === c.to);
    if (!a || !b) return;
    const ax = LABEL_W + a.x + PI_W/2, ay = HEADER_H + a.y + 28;
    const bx = LABEL_W + b.x + PI_W/2, by = HEADER_H + b.y + 28;
    const mx = (ax + bx) / 2;
    const d = 'M' + ax + ',' + ay + ' C' + mx + ',' + ay + ' ' + mx + ',' + by + ' ' + bx + ',' + by;
    h += '<path class="vis" d="' + d + '"/><path class="hit" data-cid="' + c.id + '" d="' + d + '"/>';
  });
  h += '</svg>';

  canvas.innerHTML = h;
}

/* ---------- Interaktion (Delegation) ---------- */
let drag = null;

canvas.addEventListener('pointerdown', e => {
  if (previewState) return;
  const rs = e.target.closest('.phase-resize');
  if (rs) { const i = +rs.dataset.ri; drag = { type:'resize', i, x0:e.clientX, w0: state.phases[i].w }; e.preventDefault(); return; }
  const ms = e.target.closest('.ms-flag');
  if (ms) { const m = state.milestones.find(x => x.id === ms.dataset.mid); drag = { type:'ms', m, x0:e.clientX, mx0:m.x, moved:false }; e.preventDefault(); return; }
  const pi = e.target.closest('.postit');
  if (pi && !connectMode) {
    const p = getPostit(pi.dataset.pid);
    drag = { type:'pi', p, el:pi, x0:e.clientX, y0:e.clientY, px0:p.x, py0:p.y, moved:false };
    e.preventDefault();
  }
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.type === 'pi') {
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    drag.p.x = clamp(drag.px0 + dx, 0, canvasW() - PI_W);
    drag.p.y = clamp(drag.py0 + dy, 0, canvasH() - 40);
    drag.el.style.left = (LABEL_W + drag.p.x) + 'px';
    drag.el.style.top = (HEADER_H + drag.p.y) + 'px';
  } else if (drag.type === 'ms') {
    const dx = e.clientX - drag.x0;
    if (Math.abs(dx) > 3) drag.moved = true;
    drag.m.x = clamp(drag.mx0 + dx, 0, canvasW() - 2);
    render();
  } else if (drag.type === 'resize') {
    state.phases[drag.i].w = clamp(drag.w0 + (e.clientX - drag.x0), 140, 900);
    render();
  }
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const moved = drag.moved || drag.type === 'resize';
  drag = null;
  if (moved) { save(); render(); }
});

canvas.addEventListener('click', e => {
  if (previewState) return;
  if (connectMode) {
    const hit = e.target.closest('.hit');
    if (hit) { state.connections = state.connections.filter(c => c.id !== hit.dataset.cid); save(); render(); return; }
    const pi = e.target.closest('.postit');
    if (pi) {
      const id = pi.dataset.pid;
      if (!connectSrc) { connectSrc = id; render(); }
      else if (connectSrc !== id) {
        state.connections.push({ id: uid('c'), from: connectSrc, to: id });
        connectSrc = null; save(); render();
      }
      return;
    }
    return;
  }
  const zoom = e.target.closest('.phase-zoom');
  if (zoom) { openLupe(+zoom.dataset.zi); return; }
  const ph = e.target.closest('.phase-head');
  if (ph && !e.target.closest('.phase-resize')) openPhaseModal(+ph.dataset.pi);
});

canvas.addEventListener('dblclick', e => {
  if (previewState) return;
  const pi = e.target.closest('.postit');
  if (pi) { openPostitModal(pi.dataset.pid); return; }
  const ms = e.target.closest('.ms-flag');
  if (ms) { openMilestoneModal(ms.dataset.mid); return; }
  const ll = e.target.closest('.lane-label');
  if (ll) { openLaneModal(ll.dataset.lane); return; }
  const row = e.target.closest('.lane-row');
  if (row) {
    const r = canvas.getBoundingClientRect();
    const x = clamp(e.clientX - r.left - LABEL_W - PI_W/2, 0, canvasW() - PI_W);
    const y = clamp(e.clientY - r.top - HEADER_H - 20, 0, canvasH() - 40);
    const laneIdx = +row.dataset.laneidx;
    const np = { id: uid('p'), x, y, text: 'Neues Post-it – Doppelklick zum Bearbeiten', color: LANE_COLOR[LANE_KEYS[laneIdx]] || PALETTE[0] };
    state.postits.push(np); save(); render(); openPostitModal(np.id);
  }
});

/* ---------- Modals ---------- */
const overlay = document.getElementById('overlay'), modalBox = document.getElementById('modalBox');
function openModal(html, wide) { modalBox.className = 'modal' + (wide ? ' wide' : ''); modalBox.innerHTML = html; overlay.style.display = 'flex'; }
function closeModal() { overlay.style.display = 'none'; modalBox.innerHTML = ''; modalBox.className = 'modal'; }
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

function openPostitModal(id) {
  const p = getPostit(id); if (!p) return;
  let sw = ''; PALETTE.forEach(c => { sw += '<div class="swatch' + (p.color === c ? ' sel' : '') + '" data-c="' + c + '" style="background:' + c + '"></div>'; });
  openModal('<h3>Post-it bearbeiten</h3><label>Text</label><textarea id="mText" rows="4">' + esc(p.text) + '</textarea><label>Farbe</label><div class="swatches">' + sw + '</div><div class="btnrow"><button class="go" id="mSave">Speichern</button><button id="mCancel">Abbrechen</button><button class="del" id="mDel">L&ouml;schen</button></div>');
  modalBox.querySelectorAll('.swatch').forEach(el => el.onclick = () => { modalBox.querySelectorAll('.swatch').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); });
  document.getElementById('mSave').onclick = () => {
    p.text = document.getElementById('mText').value;
    const sel = modalBox.querySelector('.swatch.sel'); if (sel) p.color = sel.dataset.c;
    save(); render(); closeModal();
  };
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mDel').onclick = () => {
    state.postits = state.postits.filter(x => x.id !== id);
    state.connections = state.connections.filter(c => c.from !== id && c.to !== id);
    save(); render(); closeModal();
  };
}

function autoGrow(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }
function openPhaseModal(i) {
  const p = state.phases[i]; if (!p) return;
  const ta = (k, cls) => '<textarea id="ei_' + k + '"' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(p[k] || '') + '</textarea>';
  const wf = (k, lbl) => '<div><label>' + lbl + '</label>' + ta(k) + '</div>';
  const hasNext = i + 1 < state.phases.length;
  openModal('<h3>System-Ei &middot; Phase ' + (i+1) + '</h3>'
    + '<div class="ei-sub">Eine Phase ist ein Teilsystem: Inputfilter &rarr; W-Fragen + Ziel &rarr; Outputfilter. Der Output dieser Phase ist der Inputfilter der n&auml;chsten.</div>'
    + '<label>Phase benennen</label><input type="text" id="ei_name" value="' + esc(p.name) + '">'
    + '<label>Ziel der Phase (Soll-Zustand)</label><textarea id="ei_ziel" class="ei-ziel-big"></textarea>'
    + '<div class="ei-wrap">'
      + '<div class="ei-col ei-in"><label>Inputfilter</label>' + ta('input') + '</div>'
      + '<div class="ei-flow">&#8594;</div>'
      + '<div class="ei-col ei-egg"><div class="ei-egg-h">W-Fragen</div>'
        + '<div class="ei-w">' + wf('wer','Wer?') + wf('was','Was?') + wf('wann','Wann?') + wf('wie','Wie?') + '</div>'
      + '</div>'
      + '<div class="ei-flow">&#8594;</div>'
      + '<div class="ei-col ei-out"><label>Outputfilter</label>' + ta('output') + '</div>'
    + '</div>'
    + '<div class="btnrow">'
      + (hasNext ? '<button class="go" id="mNext">Output &rarr; Input von Phase ' + (i+2) + '</button>' : '')
      + '<button class="del" id="mDel">Phase l&ouml;schen</button>'
      + '<button id="mCancel">Schliessen</button>'
    + '</div>', true);
  document.getElementById('ei_ziel').value = p.ziel || '';
  const fields = ['ziel','input','output','wer','was','wann','wie'];
  fields.forEach(k => { const el = document.getElementById('ei_' + k); autoGrow(el); el.addEventListener('input', () => autoGrow(el)); });
  const collect = () => {
    p.name = document.getElementById('ei_name').value || p.name;
    fields.forEach(k => { p[k] = document.getElementById('ei_' + k).value; });
  };
  document.getElementById('mCancel').onclick = () => { collect(); save(); render(); closeModal(); };
  if (hasNext) document.getElementById('mNext').onclick = () => {
    collect();
    const nx = state.phases[i+1];
    nx.input = p.output ? (nx.input ? nx.input + '\n' + p.output : p.output) : nx.input;
    save(); render(); closeModal(); openPhaseModal(i+1);
  };
  document.getElementById('mDel').onclick = () => {
    if (state.phases.length <= 1) { closeModal(); return; }
    state.phases.splice(i, 1); save(); render(); closeModal();
  };
}

function openMilestoneModal(id) {
  const m = state.milestones.find(x => x.id === id); if (!m) return;
  openModal('<h3>Meilenstein</h3><label>Bezeichnung</label><input type="text" id="mLabel" value="' + esc(m.label) + '"><div class="btnrow"><button class="go" id="mSave">Speichern</button><button id="mCancel">Abbrechen</button><button class="del" id="mDel">L&ouml;schen</button></div>');
  document.getElementById('mSave').onclick = () => { m.label = document.getElementById('mLabel').value || m.label; save(); render(); closeModal(); };
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mDel').onclick = () => { state.milestones = state.milestones.filter(x => x.id !== id); save(); render(); closeModal(); };
}

function openLaneModal(key) {
  const l = LANES.find(x => x.key === key); if (!l) return;
  openModal('<h3>Ebene umbenennen</h3><label>Titel</label><input type="text" id="mLane" value="' + esc(laneTitle(l)) + '"><div class="btnrow"><button class="go" id="mSave">Speichern</button><button id="mCancel">Abbrechen</button></div>');
  document.getElementById('mSave').onclick = () => {
    const v = document.getElementById('mLane').value.trim();
    if (v && v !== l.title) state.laneTitles[key] = v; else delete state.laneTitles[key];
    save(); render(); closeModal();
  };
  document.getElementById('mCancel').onclick = closeModal;
}

/* ---------- Kopfleisten-Knöpfe ---------- */
document.getElementById('addPhase').onclick = () => {
  if (previewState) return;
  state.phases.push({ id: uid('ph'), name: 'Neue Phase', w: PHASE_W, ziel:'', input:'', output:'', wer:'', was:'', wann:'', wie:'' });
  save(); render();
};
document.getElementById('addMs').onclick = () => {
  if (previewState) return;
  const sc = document.getElementById('wallScroll');
  const x = clamp(sc.scrollLeft + sc.clientWidth/2 - LABEL_W, 40, canvasW() - 40);
  state.milestones.push({ id: uid('m'), x, label: 'Meilenstein' });
  save(); render();
};
document.getElementById('connectBtn').onclick = () => {
  connectMode = !connectMode; connectSrc = null;
  document.getElementById('connectBtn').classList.toggle('active', connectMode);
  document.body.classList.toggle('connect', connectMode);
  render();
  sysMsg(connectMode ? 'Verbinden: erst Quelle, dann Ziel anklicken. Klick auf eine Linie löscht sie.' : 'Verbinden beendet.');
};
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'prozesswand-export.json'; a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { state = normalizeState(JSON.parse(r.result)); save(); goalInput.value = state.goal || ''; render(); sysMsg('Import erfolgreich.'); }
    catch (err) { sysMsg('Import fehlgeschlagen: ' + err.message); }
  };
  r.readAsText(f); e.target.value = '';
});
document.getElementById('undoBtn').onclick = () => {
  if (!undoBackup) return;
  state = normalizeState(JSON.parse(undoBackup)); undoBackup = null;
  document.getElementById('undoBtn').style.display = 'none';
  goalInput.value = state.goal || ''; save(); render(); sysMsg('Vorheriger Stand wiederhergestellt.');
};

/* ---------- KI: Schlüssel & API ---------- */
const KEY_STORE = 'pw-anthropic-key';
function getKey() {
  let k = localStorage.getItem(KEY_STORE);
  if (k) return k;

  for (const alt of ['anthropic-key','anthropic-api-key','claude-api-key','osto-api-key']) {
    k = localStorage.getItem(alt);
    if (k) { localStorage.setItem(KEY_STORE, k); return k; }
  }
  return '';
}
function openKeyModal(then) {
  openModal('<h3>Anthropic API-Schl&uuml;ssel</h3><p style="font-size:12px;color:var(--muted)">Wird nur in diesem Browser gespeichert. Schl&uuml;ssel gibt es unter console.anthropic.com &rarr; API Keys.</p><label>Schl&uuml;ssel</label><input type="password" id="mKey" value="' + esc(getKey()) + '" placeholder="sk-ant-..."><div class="btnrow"><button class="go" id="mSave">Speichern</button><button id="mCancel">Abbrechen</button></div>');
  document.getElementById('mSave').onclick = () => {
    const v = document.getElementById('mKey').value.trim();
    if (v) localStorage.setItem(KEY_STORE, v);
    closeModal();
    if (v && then) then();
  };
  document.getElementById('mCancel').onclick = closeModal;
}
document.getElementById('keyBtn').onclick = () => openKeyModal(null);

async function callClaude(system, user, model, maxTok) {
  const key = getKey();
  if (!key) throw new Error('Kein API-Schlüssel hinterlegt.');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({ model, max_tokens: maxTok || 2000, system, messages: [{ role: 'user', content: user }] })
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.error && data.error.message) || ('HTTP ' + res.status));
  return (data.content || []).map(b => b.text || '').join('');
}

async function runChat(prompt, label) {
  addMsg('user', label || prompt);
  const wait = addMsg('sys', '… denkt nach …', { transient: true });
  try {
    convo.push({ role: 'user', content: prompt });
    if (convo.length > 12) convo = convo.slice(-12);
    const key = getKey();
    if (!key) { wait.remove(); openKeyModal(() => runChat(prompt, label)); return; }
    const hist = convo.map(m => (m.role === 'user' ? 'Nutzer: ' : 'Moderator: ') + m.content).join('\n\n');
    const out = await callClaude(MODERATOR_SYS + wallContext(), hist, 'claude-sonnet-5', 1500);

}

const MODELS = { architekt: 'claude-sonnet-5', planer: 'claude-haiku-4-5-20251001', kritiker: 'claude-sonnet-5', verbinder: 'claude-haiku-4-5-20251001' };
const MODEL_FALLBACK = 'claude-sonnet-5';

async function agentCall(role, system, user, maxTok) {
  try { return await callClaude(system, user, MODELS[role], maxTok); }
  catch (e) {
    if (/model/i.test(e.message) && MODELS[role] !== MODEL_FALLBACK) return await callClaude(system, user, MODEL_FALLBACK, maxTok);
    throw e;
  }
}
function extractJSON(t) {
  t = t.replace(/```json/gi, '```').replace(/```/g, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error('Keine JSON-Antwort erhalten.');
  return JSON.parse(t.slice(a, b + 1));
}
async function agentJSON(role, system, user, maxTok) {
  const sys = system + '\n\nAntworte AUSSCHLIESSLICH mit gültigem JSON, ohne Erklärtext.';
  try { return extractJSON(await agentCall(role, sys, user, maxTok)); }
  catch (e) {
    if (e instanceof SyntaxError || /JSON/.test(e.message)) {
      return extractJSON(await agentCall(role, sys, user + '\n\nWICHTIG: Nur gültiges JSON ausgeben.', maxTok));
    }
    throw e;
  }
}

async function runSwarm(cfg) {
  const TIEFE_N = { grob: 3, mittel: 4, fein: 6 };
  try {
    sysMsg('🏛️ Architekt-Agent plant Phasen und Entscheid-Tore …');
    const arch = await agentJSON('architekt',
      'Du bist der ARCHITEKT-Agent. Du stückelst ein Projekt in Phasen nach dieser Methodik:\n\n' + METHODIK
      + '\n\nErzeuge 4–8 projektspezifische Phasen. Format:\n{"phasen":[{"name":"...","anteil":15,"gate":{"name":"Entscheid: ...","kriterien":["messbares Kriterium 1","Kriterium 2"]}}]}\n"anteil" = geschätzter Anteil an der Projektdauer in Prozent (Summe ≈ 100).',
      'Gesamtziel: ' + cfg.ziel + '\nZeitrahmen: ' + (cfg.zeit || 'offen') + '\nKontext: ' + (cfg.kontext || 'keiner angegeben') + '\nDetailtiefe: ' + cfg.tiefe, 2500);
    if (!arch || !Array.isArray(arch.phasen) || arch.phasen.length < 3) throw new Error('Architekt lieferte keine brauchbare Phasenstruktur.');
    const phasen = arch.phasen.slice(0, 8);
    sysMsg('✅ ' + phasen.length + ' Phasen: ' + phasen.map(p => p.name).join(' → '));

    const plaene = [];
    for (let i = 0; i < phasen.length; i++) {
      const fein = i < 2 ? cfg.tiefe : 'grob';
      const nMax = TIEFE_N[fein];
      sysMsg('📋 Planer-Agent: Phase ' + (i+1) + ' – ' + phasen[i].name + ' (' + fein + ') …');
      let plan = null;
      for (let att = 0; att < 2 && !plan; att++) {
        try {
          plan = await agentJSON('planer',
            'Du bist der PLANER-Agent. Du planst EINE Phase nach dieser Methodik:\n\n' + METHODIK
            + '\n\nFormat:\n{"ei":{"ziel":"...","input":"...","output":"...","wer":"...","was":"...","wann":"...","wie":"..."},'
            + '"schritte":["..."],"ergebnisse":["..."],"management":["..."],"zwischenziele":["..."],"experten":["..."]}\n'
            + 'Max. ' + nMax + ' schritte, max. 3 ergebnisse, max. 2 management, max. 2 zwischenziele, max. 2 experten. Detailtiefe: ' + fein + '.',
            'Projektziel: ' + cfg.ziel + '\nZeitrahmen: ' + (cfg.zeit || 'offen') + '\nKontext: ' + (cfg.kontext || '-')
            + '\nPhase ' + (i+1) + ' von ' + phasen.length + ': ' + phasen[i].name
            + '\nGate am Phasenende: ' + (phasen[i].gate && phasen[i].gate.name || 'Entscheid')
            + (i > 0 ? '\nErgebnisse der Vorphase: ' + (plaene[i-1] && plaene[i-1].ergebnisse || []).join('; ') : ''), 2500);
        } catch (e) { if (att === 1) sysMsg('⚠️ Phase ' + (i+1) + ' übersprungen: ' + e.message); }
      }
      plaene.push(plan || { ei: {}, schritte: [], ergebnisse: [], management: [], zwischenziele: [], experten: [] });
    }

    sysMsg('🔍 Kritiker-Agent: Pre-Mortem, Retro & Anspruchsgruppen-Check …');
    let kritik = null;
    try {
      kritik = await agentJSON('kritiker',
        'Du bist der KRITIKER-Agent (Pre-Mortem und Anspruchsgruppen-Check) nach dieser Methodik:\n\n' + METHODIK
        + '\n\nFormat:\n{"phasen":[{"index":0,"risiken":["..."],"retro":"...","anspruchsgruppen":["..."],"review":"..."}]}\n'
        + 'Je Phase: max. 2 risiken (Pre-Mortem, konkret), 1 retro-Frage, max. 3 anspruchsgruppen (wer betroffen/wer fehlt), 1 review (Review-Punkt mit Anspruchsgruppen).',
        'Projektziel: ' + cfg.ziel + '\nKontext: ' + (cfg.kontext || '-') + '\nPhasen:\n'
        + phasen.map((p, i) => (i) + ': ' + p.name + ' | Schritte: ' + (plaene[i].schritte || []).join('; ')).join('\n'), 3000);
    } catch (e) { sysMsg('⚠️ Kritiker übersprungen: ' + e.message); }

    const pv = buildPreview(cfg, phasen, plaene, kritik);

    sysMsg('🔗 Verbinder-Agent knüpft Ablauf und Rückkopplungen …');
    try {
      const liste = pv.cards.map(c => c.key + ' [' + c.lane + ', Phase ' + (c.phase+1) + ']: ' + c.text.slice(0, 60)).join('\n');
      const verb = await agentJSON('verbinder',
        'Du bist der VERBINDER-Agent. Du verbindest Karten einer Prozesswand zu einem Netzplan (Vorgänger → Nachfolger), inklusive Rückkopplungen von Ergebnissen zur Management- oder Sachebene.\n'
        + 'Format: {"verbindungen":[["K1","K2"],["K2","K5"]]}\nMax. ' + Math.min(24, pv.cards.length * 2) + ' Verbindungen, nur sinnvolle.',
        'Karten:\n' + liste, 1800);
      if (verb && Array.isArray(verb.verbindungen)) {
        const byKey = {}; pv.cards.forEach(c => { byKey[c.key] = c.id; });
        verb.verbindungen.forEach(v => {
          if (Array.isArray(v) && byKey[v[0]] && byKey[v[1]] && v[0] !== v[1])
            pv.state.connections.push({ id: uid('c'), from: byKey[v[0]], to: byKey[v[1]] });
        });
      }
    } catch (e) { sysMsg('⚠️ Verbinder übersprungen – Standard-Kette wird genutzt.'); }
    if (!pv.state.connections.length) {
      for (let i = 0; i + 1 < pv.chain.length; i++)
        pv.state.connections.push({ id: uid('c'), from: pv.chain[i], to: pv.chain[i+1] });
    }

    previewState = pv.state; previewMeta = cfg;
    document.getElementById('previewBar').style.display = 'flex';
    render();
    sysMsg('✅ Entwurf fertig: ' + pv.state.postits.length + ' Post-its, ' + pv.state.connections.length + ' Verbindungen, ' + pv.state.milestones.length + ' Gates. Oben wählen: Ersetzen, Ergänzen oder Verwerfen.');
  } catch (e) {
    sysMsg('❌ Schwarm abgebrochen: ' + e.message);
  }
}

function buildPreview(cfg, phasen, plaene, kritik) {
  const totalW = Math.max(phasen.length, 6) * PHASE_W;
  const sumAnteil = phasen.reduce((t, p) => t + (typeof p.anteil === 'number' && p.anteil > 0 ? p.anteil : 100 / phasen.length), 0);
  const st = { goal: cfg.ziel, phases: [], postits: [], connections: [], milestones: [], laneTitles: Object.assign({}, state.laneTitles) };
  phasen.forEach((p, i) => {
    const anteil = (typeof p.anteil === 'number' && p.anteil > 0 ? p.anteil : 100 / phasen.length) / sumAnteil;
    const ei = plaene[i].ei || {};
    st.phases.push({ id: uid('ph'), name: p.name, w: clamp(Math.round(totalW * anteil), 220, 640),
      ziel: ei.ziel || '', input: ei.input || '', output: ei.output || '', wer: ei.wer || '', was: ei.was || '', wann: ei.wann || '', wie: ei.wie || '' });
  });

  const laneCount = {};
  const cards = [], chain = [];
  let kn = 0;
  function put(phaseIdx, laneKey, text, toChain) {
    const li = LANE_KEYS.indexOf(laneKey);
    const left = phaseLeft(phaseIdx, st), w = st.phases[phaseIdx].w;
    const ck = phaseIdx + '|' + laneKey;
    const k = laneCount[ck] = (laneCount[ck] || 0) + 1;
    const x = clamp(left + 10 + ((k-1) * 28) % Math.max(40, w - PI_W - 20), 0, canvasW(st) - PI_W);
    const y = li * LANE_H + 6 + ((k-1) * 22) % (LANE_H - 62);
    const id = uid('p');
    st.postits.push({ id, x, y, text, color: LANE_COLOR[laneKey] || PALETTE[0] });
    kn++; cards.push({ key: 'K' + kn, id, lane: laneKey, phase: phaseIdx, text });
    if (toChain) chain.push(id);
    return id;
  }

  phasen.forEach((p, i) => {
    const pl = plaene[i], kr = kritik && Array.isArray(kritik.phasen) ? (kritik.phasen.find(x => x.index === i) || {}) : {};
    (kr.risiken || []).slice(0, 2).forEach(t => put(i, 'reflexion', '⚠️ ' + t));
    if (kr.retro) put(i, 'reflexion', '↻ Retro: ' + kr.retro);
    (pl.experten || []).slice(0, 2).forEach(t => put(i, 'input', '💡 ' + t));
    (pl.management || []).slice(0, 2).forEach((t, j) => put(i, j === 0 ? 'mgmt2' : 'mgmt1', '🧭 ' + t));
    (pl.zwischenziele || []).slice(0, 2).forEach(t => put(i, 'sache', '🎯 ' + t));
    (pl.schritte || []).slice(0, 6).forEach(t => put(i, 'handlung', t, true));
    (pl.ergebnisse || []).slice(0, 3).forEach(t => put(i, 'doku', '📄 ' + t));
    (kr.anspruchsgruppen || []).slice(0, 3).forEach(t => put(i, 'anspruch', '👥 ' + t));
    if (kr.review) put(i, 'anspruch', '👥 Review: ' + kr.review);
    const gateName = (p.gate && p.gate.name) || ('Entscheid Phase ' + (i+1));
    const krit = p.gate && Array.isArray(p.gate.kriterien) && p.gate.kriterien.length ? ' – Kriterien: ' + p.gate.kriterien.join('; ') : '';
    st.milestones.push({ id: uid('m'), x: clamp(phaseLeft(i, st) + st.phases[i].w - 4, 20, canvasW(st) - 4), label: gateName + krit });
  });

  return { state: st, cards, chain };
}

function boardName() { const b = activeBoard(); return b ? b.name : 'Projekt'; }
function heute() { const d = new Date(); return ('0'+d.getDate()).slice(-2) + '.' + ('0'+(d.getMonth()+1)).slice(-2) + '.' + d.getFullYear(); }
function tasksOfPhase(i) { return cardsInPhaseLane(i, 'handlung'); }
function cleanTxt(t) { return (t||'').replace(/^[⚠️↻👥📄🎯🧭💡]+\s*/u, ''); }

const DOC_CSS = 'body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#1d2530;margin:2cm}'
  + 'h1{font-size:16pt;margin:0 0 2pt} .sub{color:#6b7280;font-size:10pt;margin-bottom:14pt}'
  + 'h2{font-size:12pt;margin:14pt 0 4pt;border-bottom:0.5pt solid #c9cdd3;padding-bottom:2pt}'
  + 'table{border-collapse:collapse;width:100%;margin:6pt 0} td,th{border:0.5pt solid #b9bec6;padding:4pt 6pt;font-size:10pt;vertical-align:top;text-align:left}'
  + 'th{background:#eef1f5;font-weight:bold} .kopf td:first-child{width:32%;background:#f5f7fa;font-weight:bold}'
  + '.ph{color:#8a6d1a;background:#fdf6dd} .platz{color:#8a6d1a} .blk{background:#eef1f5;font-weight:bold} .tot{font-weight:bold;background:#f5f7fa}'
  + '.logo{max-height:46pt;margin-bottom:8pt} ul{margin:4pt 0 4pt 16pt;padding:0} li{margin:2pt 0}';

function docShell(title, body) {
  const logo = collection.logo ? '<img class="logo" src="' + collection.logo + '">' : '';
  return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>' + DOC_CSS + '</style></head><body>'
    + logo + '<h1>' + esc(title) + '</h1><div class="sub">' + esc(boardName()) + ' &middot; ' + heute() + ' &middot; erzeugt aus der OSTO/SYMA Prozesswand</div>' + body + '</body></html>';
}
function downloadDoc(filename, html) {
  const blob = new Blob(['﻿' + html], { type: 'application/msword' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); URL.revokeObjectURL(a.href);
}
function downloadXls(filename, html) {
  const blob = new Blob(['﻿' + html], { type: 'application/vnd.ms-excel' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); URL.revokeObjectURL(a.href);
}
function ulOrPlatz(items, platz) {
  const li = (items||[]).filter(Boolean).map(t => '<li>' + esc(t) + '</li>').join('');
  return li ? '<ul>' + li + '</ul>' : '<p class="platz">[' + platz + ']</p>';
}
function txtOrPlatz(t, platz) { return t ? '<p>' + esc(t).replace(/\n/g,'<br>') + '</p>' : '<p class="platz">[' + platz + ']</p>'; }

function genAuftrag(ai) {
  ai = ai || {};
  const ms = state.milestones.length ? state.milestones[state.milestones.length-1].label.split(/\s[–-]\sKriterien/)[0] : '';
  let b = '<table class="kopf">'
    + '<tr><td>Projekt</td><td>' + esc(boardName()) + '</td></tr>'
    + '<tr><td>Ziel / Zweck</td><td>' + esc(state.goal || '[Gesamtziel ergänzen]') + '</td></tr>'
    + '<tr><td>Auftraggeber</td><td class="platz">[ergänzen]</td></tr>'
    + '<tr><td>Projektkoordination</td><td>' + esc((state.phases[0] && state.phases[0].wer) || '[ergänzen]') + '</td></tr>'
    + '<tr><td>Stand</td><td>Entwurf ' + heute() + '</td></tr>'
    + '<tr><td>Kritischer Meilenstein</td><td>' + esc(ms || '[ergänzen]') + '</td></tr></table>';
  b += '<h2>1. Ausgangslage</h2>' + txtOrPlatz(ai.ausgangslage || (state.phases[0] && state.phases[0].input), 'Ausgangslage ergänzen: Anlass, Dringlichkeit, Bezug zum Betrieb');
  b += '<h2>2. Zielbild / Nutzung</h2>' + txtOrPlatz(ai.zielbild || state.goal, 'Zielbild ergänzen')
    + ulOrPlatz(state.phases.map(p => p.ziel && (p.name + ': ' + p.ziel)).filter(Boolean), 'Phasenziele ergänzen');
  b += '<h2>3. Nutzen</h2>' + txtOrPlatz(ai.nutzen, 'Nutzen ergänzen: betrieblich, qualitativ, finanziell');
  b += '<h2>4. Projektumfang / Phasen</h2>';
  state.phases.forEach((p, i) => {
    b += '<p><b>Phase ' + (i+1) + ' – ' + esc(p.name) + '</b>' + (p.output ? ' &middot; Ergebnis: ' + esc(p.output) : '') + '</p>';
  });
  b += '<h2>5. Aufgaben aus der Prozesswand</h2><table><tr><th>Nr.</th><th>Phase</th><th>Aufgabe</th><th>Verantwortlich</th><th>Status</th></tr>';
  let n = 0;
  state.phases.forEach((p, i) => {
    tasksOfPhase(i).forEach(c => {
      n++;
      b += '<tr><td>' + n + '</td><td>' + (i+1) + '</td><td>' + esc(cleanTxt(c.text)) + '</td><td>' + esc(p.wer || '') + '</td><td>' + (STATUS_LABEL[c.status||'offen']) + '</td></tr>';
    });
  });
  b += '</table>';
  return docShell('Auftragsbeschrieb', b);
}

function genBeschaffung(ai) {
  ai = ai || {};
  let b = '<table class="kopf">'
    + '<tr><td>Antragsteller</td><td class="platz">[Name, Funktion]</td></tr>'
    + '<tr><td>Projekt</td><td>' + esc(boardName()) + '</td></tr>'
    + '<tr><td>Ziel der Beschaffung</td><td>' + esc(state.goal || '[ergänzen]') + '</td></tr>'
    + '<tr><td>Empfänger</td><td class="platz">[Entscheidgremium]</td></tr>'
    + '<tr><td>Antragsdatum</td><td>' + heute() + '</td></tr>'
    + '<tr><td>Status</td><td>Entwurf zur Vervollständigung</td></tr></table>';
  b += '<h2>1. Antrag / Beschluss</h2>' + (ai.antrag ? txtOrPlatz(ai.antrag,'')
    : '<ul><li>die im Projekt «' + esc(boardName()) + '» definierten Massnahmen zu genehmigen,</li><li>die finanziellen Mittel gemäss Kostenzusammenstellung zu sprechen,</li><li>den Auftrag zur Umsetzung zu erteilen.</li></ul>');
  b += '<h2>2. Ausgangslage</h2>' + txtOrPlatz(ai.ausgangslage || (state.phases[0] && state.phases[0].input), 'Ausgangslage ergänzen');
  b += '<h2>3. Begründung des Bedarfs</h2>' + (ai.begruendung ? txtOrPlatz(ai.begruendung,'')
    : ulOrPlatz(cardsInPhaseLane(0,'reflexion').concat(state.phases[1] ? cardsInPhaseLane(1,'reflexion') : []).map(c => cleanTxt(c.text)), 'Begründung ergänzen: Dringlichkeit, Risiken bei Nichtumsetzung'));
  b += '<h2>4. Kostenübersicht</h2><table><tr><th>Block</th><th>Beschreibung</th><th>Total CHF (Richtwert)</th></tr>';
  state.phases.forEach((p, i) => {
    b += '<tr><td>' + String.fromCharCode(65+i) + '</td><td>' + esc(p.name) + '</td><td class="ph">[Richtwert]</td></tr>';

function genTermin() {
  let rows = '<tr><th>Nr.</th><th>Aufgabe</th><th>Verantwortlich</th><th>Start</th><th>Dauer</th></tr>';
  let n = 0;
  state.phases.forEach((p, i) => {
    rows += '<tr class="blk"><td>P' + (i+1) + '</td><td colspan="4">Phase ' + (i+1) + ' – ' + esc(p.name) + (p.wann ? ' (' + esc(p.wann) + ')' : '') + '</td></tr>';
    tasksOfPhase(i).forEach(c => {
      n++;
      rows += '<tr><td>' + n + '</td><td>' + esc(cleanTxt(c.text)) + '</td><td>' + esc(p.wer || '') + '</td><td class="ph">' + esc(p.wann || '[KW]') + '</td><td class="ph">[Dauer]</td></tr>';
    });
  });
  if (state.milestones.length) {
    rows += '<tr class="blk"><td>&#9670;</td><td colspan="4">Meilensteine / Entscheid-Tore</td></tr>';
    state.milestones.forEach(m => { rows += '<tr><td>&#9670;</td><td colspan="4">' + esc(m.label) + '</td></tr>'; });
  }
  const logo = collection.logo ? '<img src="' + collection.logo + '" style="max-height:46pt"><br>' : '';
  const html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"><style>' + DOC_CSS + '</style></head><body>'
    + logo + '<h1>Grobterminprogramm</h1><div class="sub">' + esc(boardName()) + ' &middot; ' + heute() + ' &middot; aus der Prozesswand</div>'
    + '<table>' + rows + '</table><p class="platz">Gelb markierte Felder (Start, Dauer) sind zu präzisieren.</p></body></html>';
  return html;
}

    + '<tr class="tot"><td colspan="5">TOTAL inkl. MwSt.</td><td class="ph"></td><td></td></tr>';

    + logo + '<h1>Grobkostenvoranschlag (Richtwerte)</h1><div class="sub">' + esc(boardName()) + ' &middot; ' + heute() + ' &middot; aus der Prozesswand</div>'

/* ================================================================
   PHASEN-LUPE  – in eine Phase hineinzoomen & im Detail bearbeiten
   ================================================================ */
const STATUS_NEXT = { offen:'arbeit', arbeit:'erledigt', erledigt:'offen' };
const STATUS_LABEL = { offen:'offen', arbeit:'in Arbeit', erledigt:'erledigt' };
const LUPE_SECTIONS = [
  { lane:'handlung', title:'Aufgaben / Handlungen', add:'Aufgabe' },
  { lane:'doku',     title:'Ergebnisse / Dokumentation', add:'Ergebnis' },
  { lane:'sache',    title:'Zwischenziele', add:'Zwischenziel' },
  { lane:'reflexion',title:'Risiken & Reflexion', add:'Risiko' },
  { lane:'mgmt2',    title:'Projektleitung (Mgmt 2)', add:'Punkt' },
  { lane:'mgmt1',    title:'Bereichsleitung (Mgmt 1)', add:'Punkt' },
  { lane:'input',    title:'Experten / Input', add:'Experte' },
  { lane:'anspruch', title:'Anspruchsgruppen', add:'Gruppe' }
];
let lupeIdx = -1;

function phaseIndexOfX(x) { let acc = 0; for (let i = 0; i < state.phases.length; i++) { if (x < acc + state.phases[i].w) return i; acc += state.phases[i].w; } return state.phases.length - 1; }
function laneKeyOfY(y) { return LANE_KEYS[clamp(Math.floor(y / LANE_H), 0, LANES.length - 1)]; }
function cardsInPhaseLane(i, laneKey) { return state.postits.filter(p => phaseIndexOfX(p.x) === i && laneKeyOfY(p.y) === laneKey); }
function addCard(i, laneKey, text, status) {
  const li = LANE_KEYS.indexOf(laneKey), left = phaseLeft(i), w = state.phases[i].w;
  const n = cardsInPhaseLane(i, laneKey).length;
  const x = clamp(left + 12 + (n * 26) % Math.max(30, w - PI_W - 24), 0, canvasW(state) - PI_W);
  const y = li * LANE_H + 8 + (n * 20) % (LANE_H - 60);
  const card = { id: uid('p'), x, y, text: text || 'Neuer Eintrag', color: LANE_COLOR[laneKey] || PALETTE[0], status: status || 'offen' };
  state.postits.push(card); return card;
}

const lupe = document.getElementById('lupe'), lupeBody = document.getElementById('lupeBody');
function openLupe(i) {
  if (previewState) return;
  lupeIdx = i; lupe.style.display = 'block'; renderLupe();
}
function closeLupe() { lupe.style.display = 'none'; lupeIdx = -1; }
document.getElementById('lupeClose').onclick = closeLupe;
document.getElementById('lupePrev').onclick = () => { if (lupeIdx > 0) { lupeIdx--; renderLupe(); } };
document.getElementById('lupeNext').onclick = () => { if (lupeIdx < state.phases.length - 1) { lupeIdx++; renderLupe(); } };
lupe.addEventListener('click', e => { if (e.target === lupe) closeLupe(); });

function renderLupe() {
  const i = lupeIdx, p = state.phases[i]; if (!p) return closeLupe();
  document.getElementById('lupeTitle').textContent = p.name;
  document.getElementById('lupeNo').textContent = 'Phase ' + (i+1) + ' von ' + state.phases.length;
  const gate = state.milestones.filter(m => Math.abs(clamp(m.x,0,canvasW(state)) - (phaseLeft(i)+p.w)) < p.w*0.5);
  const eif = (k, lbl, full) => '<div class="' + (full?'full':'') + '"><label>' + lbl + '</label><textarea data-ei="' + k + '">' + esc(p[k]||'') + '</textarea></div>';
  let h = '<div class="lupe-tools">'
    + '<button class="lupe-tool" data-kind="schritte">&#129302; Schritte ergänzen</button>'
    + '<button class="lupe-tool" data-kind="risiken">&#129302; Risiken (Pre-Mortem)</button>'
    + '<button class="lupe-tool" data-kind="anspruch">&#129302; Anspruchsgruppen prüfen</button>'
    + '<button class="lupe-tool" data-kind="zusammenfassung">&#129302; Phase zusammenfassen</button>'
    + '</div>';
  h += '<div id="lupeProp"></div>';
  h += '<div class="ei-grid">' + eif('ziel','Ziel der Phase', true) + eif('input','Input') + eif('output','Output / Ergebnis') + eif('wer','Wer?') + eif('was','Was?') + eif('wann','Wann?') + eif('wie','Wie?') + '</div>';
  if (gate.length) h += '<div style="font-size:12px;color:var(--warn);margin-top:6px">&#9670; Entscheid-Tor: ' + esc(gate.map(g=>g.label).join(' | ')) + '</div>';

  LUPE_SECTIONS.forEach(sec => {
    const cards = cardsInPhaseLane(i, sec.lane);
    h += '<div class="lupe-sec"><h3>' + esc(sec.title) + ' <span class="cnt">' + cards.length + '</span><span class="add" data-addlane="' + sec.lane + '">+ ' + sec.add + '</span></h3>';
    cards.forEach(c => {
      const st = c.status || 'offen';
      h += '<div class="tk' + (st==='erledigt'?' done':'') + '" data-id="' + c.id + '">'
        + '<div class="tk-dot ' + st + '" title="Status: ' + STATUS_LABEL[st] + '"></div>'
        + '<div class="tk-text" contenteditable="true" data-id="' + c.id + '">' + esc(c.text) + '</div>'
        + '<button class="tk-ai" data-id="' + c.id + '" title="KI-Unterstützung">&#129302;</button>'
        + '<button class="tk-del" data-id="' + c.id + '" title="löschen">&#10005;</button></div>';
    });
    h += '</div>';
  });
  lupeBody.innerHTML = h;
}

/* Interaktion in der Lupe (Delegation) */
lupeBody.addEventListener('click', e => {
  const dot = e.target.closest('.tk-dot');
  if (dot) { const c = getPostit(dot.closest('.tk').dataset.id); if (c) { c.status = STATUS_NEXT[c.status||'offen']; save(); renderLupe(); render(); } return; }
  const del = e.target.closest('.tk-del');
  if (del) { state.postits = state.postits.filter(x => x.id !== del.dataset.id); state.connections = state.connections.filter(c => c.from !== del.dataset.id && c.to !== del.dataset.id); save(); renderLupe(); render(); return; }
  const add = e.target.closest('.add');
  if (add) { addCard(lupeIdx, add.dataset.addlane, 'Neuer Eintrag – Text bearbeiten', 'offen'); save(); renderLupe(); render(); return; }
  const ai = e.target.closest('.tk-ai');
  if (ai) { cardAI(ai.dataset.id); return; }
  const tool = e.target.closest('.lupe-tool');
  if (tool) { phaseTool(tool.dataset.kind); return; }
});
lupeBody.addEventListener('focusout', e => {
  const tx = e.target.closest('.tk-text');
  if (tx) { const c = getPostit(tx.dataset.id); if (c) { const v = tx.textContent.trim(); if (v && v !== c.text) { c.text = v; save(); render(); } } return; }
  const ei = e.target.closest('[data-ei]');
  if (ei) { const p = state.phases[lupeIdx]; if (p) { p[ei.dataset.ei] = ei.value; save(); render(); } }
});

/* KI-Dialog pro Aufgabe – Anweisungen geben, KI passt an */
async function cardAI(id) {
  const c = getPostit(id); if (!c) return;
  if (!getKey()) { openKeyModal(() => cardAI(id)); return; }
  const row = lupeBody.querySelector('.tk[data-id="' + id + '"]');
  if (!row) return;
  const existing = row.nextElementSibling;
  if (existing && existing.classList.contains('tk-ai-box')) { existing.remove(); return; } // Toggle
  const box = document.createElement('div');
  box.className = 'tk-ai-box';
  box.innerHTML = '<div class="tk-ai-msgs"></div>'
    + '<div class="tk-ai-in"><textarea rows="2" placeholder="Anweisung an die KI, z.B. «bitte Antragsformular verwenden» …"></textarea><button class="send">Senden</button></div>'
    + '<div class="row"><button class="take">Letzte Antwort als Ergebnis übernehmen</button><button class="drop">Schliessen</button></div>';
  row.after(box);
  const p = state.phases[lupeIdx];
  const sys = 'Du bist ein Fach-Assistent in einer Projekt-Prozesswand (Systems Engineering). Du arbeitest eine einzelne Aufgabe konkret aus und passt sie auf Anweisung des Nutzers an (z.B. bestimmte Formulare, Vorlagen, Adressaten oder Detailtiefe). Kurz, praxisnah, auf Deutsch. Kein Vorgeplänkel.';
  const dlg = []; let lastAnswer = '';
  const msgsEl = box.querySelector('.tk-ai-msgs');
  const inEl = box.querySelector('textarea');
  const renderDlg = () => { msgsEl.innerHTML = dlg.map(m => '<div class="am ' + m.role + '">' + esc(m.text) + '</div>').join(''); msgsEl.scrollTop = msgsEl.scrollHeight; };
  async function send(instr) {
    dlg.push({ role:'user', text: instr }); const think = { role:'ai', text:'… denkt nach …' }; dlg.push(think); renderDlg();
    try {
      const hist = 'Projektziel: ' + (state.goal||'-') + '\nPhase: ' + p.name + '\nAufgabe: "' + c.text + '"\n\n'
        + dlg.filter(m => m !== think).map(m => (m.role==='user' ? 'Anweisung: ' : 'Assistent: ') + m.text).join('\n\n');
      const out = await callClaude(sys, hist, 'claude-sonnet-5', 1100);
      dlg.splice(dlg.indexOf(think), 1); dlg.push({ role:'ai', text: out }); lastAnswer = out; renderDlg();
    } catch (e) { dlg.splice(dlg.indexOf(think), 1); dlg.push({ role:'ai', text:'❌ ' + e.message }); renderDlg(); }
  }
  box.querySelector('.send').onclick = () => { const v = inEl.value.trim(); if (!v) return; inEl.value = ''; send(v); };
  inEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); box.querySelector('.send').click(); } });
  box.querySelector('.drop').onclick = () => box.remove();
  box.querySelector('.take').onclick = () => {
    if (!lastAnswer) return;
    const first = lastAnswer.split('\n').find(l => l.trim()) || lastAnswer;
    addCard(lupeIdx, 'doku', '📄 ' + first.slice(0, 140).replace(/^[-•#\d.\s]+/, ''), 'offen');
    save(); renderLupe(); render();
  };
  send('Bitte diese Aufgabe konkret ausarbeiten: Teilschritte, erwartetes Ergebnis, worauf achten.');
}

/* Phasen-Analyse-Tools (mit Freigabe) */
async function phaseTool(kind) {
  const prop = document.getElementById('lupeProp');
  const p = state.phases[lupeIdx];
  document.querySelectorAll('.lupe-tool').forEach(b => b.disabled = true);
  if (!getKey()) { document.querySelectorAll('.lupe-tool').forEach(b => b.disabled = false); openKeyModal(() => phaseTool(kind)); return; }
  const ctx = 'Projektziel: ' + (state.goal||'-') + '\nPhase ' + (lupeIdx+1) + ': ' + p.name
    + '\nBereits vorhanden – Schritte: ' + cardsInPhaseLane(lupeIdx,'handlung').map(c=>c.text).join('; ')
    + ' | Risiken: ' + cardsInPhaseLane(lupeIdx,'reflexion').map(c=>c.text).join('; ')
    + ' | Anspruchsgruppen: ' + cardsInPhaseLane(lupeIdx,'anspruch').map(c=>c.text).join('; ');
  try {
    if (kind === 'zusammenfassung') {
      prop.style.display = 'block'; prop.innerHTML = '🤖 fasst zusammen …';
      const out = await callClaude('Du bist Projektmoderator. Fasse den Stand dieser Phase in 4–6 Sätzen zusammen: Ziel, Vorgehen, offene Punkte, Risiken. Deutsch, sachlich.', ctx + '\n\n' + wallContext(), 'claude-sonnet-5', 700);
      prop.innerHTML = '<h4>Zusammenfassung Phase ' + (lupeIdx+1) + '</h4><div style="font-size:12.5px;white-space:pre-wrap">' + esc(out) + '</div><div class="row"><button class="drop">Schliessen</button></div>';
      prop.querySelector('.drop').onclick = () => { prop.style.display = 'none'; };
      return;
    }
    const cfgKind = {
      schritte:  { lane:'handlung', label:'Schritte / Aufgaben', prefix:'', sys:'Nenne bis zu 5 zusätzliche, konkrete Arbeitsschritte für diese Phase, die noch fehlen. Keine Wiederholungen.' },
      risiken:   { lane:'reflexion', label:'Risiken (Pre-Mortem)', prefix:'⚠️ ', sys:'Führe ein Pre-Mortem durch: nenne bis zu 5 konkrete Risiken/Fehlerquellen dieser Phase, die noch nicht genannt sind.' },
      anspruch:  { lane:'anspruch', label:'Anspruchsgruppen', prefix:'👥 ', sys:'Nenne bis zu 5 betroffene oder fehlende Anspruchsgruppen/Stakeholder dieser Phase, die noch nicht genannt sind.' }
    }[kind];
    prop.style.display = 'block'; prop.innerHTML = '🤖 erarbeitet Vorschläge …';
    const data = await (async () => {
      const sys = cfgKind.sys + '\nAntworte AUSSCHLIESSLICH als JSON: {"items":["...","..."]}';
      const t = await callClaude(sys, ctx, 'claude-sonnet-5', 800);
      return extractJSON(t);
    })();
    const items = (data.items || []).filter(x => typeof x === 'string' && x.trim()).slice(0, 6);
    if (!items.length) { prop.innerHTML = '<h4>Keine neuen Vorschläge.</h4><div class="row"><button class="drop">Schliessen</button></div>'; prop.querySelector('.drop').onclick = () => prop.style.display='none'; return; }
    prop.innerHTML = '<h4>Vorschläge: ' + cfgKind.label + ' (auswählen &amp; übernehmen)</h4>'
      + items.map((t, j) => '<label><input type="checkbox" checked data-j="' + j + '"><span>' + esc(t) + '</span></label>').join('')
      + '<div class="row"><button class="take">Übernehmen</button><button class="drop">Verwerfen</button></div>';
    prop.querySelector('.drop').onclick = () => { prop.style.display = 'none'; };
    prop.querySelector('.take').onclick = () => {
      prop.querySelectorAll('input[type=checkbox]').forEach(cb => { if (cb.checked) addCard(lupeIdx, cfgKind.lane, cfgKind.prefix + items[+cb.dataset.j], 'offen'); });
      prop.style.display = 'none'; save(); renderLupe(); render();
    };
  } catch (e) {
    prop.style.display = 'block'; prop.innerHTML = '❌ ' + esc(e.message) + '<div class="row"><button class="drop">Schliessen</button></div>';
    prop.querySelector('.drop').onclick = () => prop.style.display = 'none';
  } finally {
    document.querySelectorAll('.lupe-tool').forEach(b => b.disabled = false);
  }
}

/* ---------- Supabase: Konten & Cloud-Speicher ---------- */
async function loadFromCloud() {
  try {
    const { data, error } = await sb.from('walls').select('data').eq('user_id', currentUser.id).maybeSingle();
    if (error) throw error;
    loadCollection(data && data.data);
    sysMsg('Willkommen! ' + collection.boards.length + ' Prozesswand(-wände) geladen. Oben links wechseln oder «Wände…» verwalten.', true);
  } catch (e) {
    loadCollection(null);
    sysMsg('Cloud-Laden fehlgeschlagen: ' + (e.message || e), true);
  }
}
async function cloudSave() {
  if (!sb || !currentUser) return;
  syncActive();
  try {
    const { error } = await sb.from('walls').upsert({ user_id: currentUser.id, data: collection, updated_at: new Date().toISOString() });
    if (error) throw error;
  } catch (e) { /* lokale Kopie bleibt erhalten */ }
}
function scheduleCloudSave() {
  if (!sb || !currentUser) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(cloudSave, 1500);
}

/* ---------- Auth-Gate ---------- */
const authGate = document.getElementById('authGate');
function showAuth(msg) {
  authGate.style.display = 'flex';
  if (msg !== undefined) document.getElementById('authErr').textContent = msg;
}
async function startApp(user) {
  currentUser = user;
  document.getElementById('userTag').textContent = user.email || '';
  document.getElementById('logoutBtn').style.display = '';
  authGate.style.display = 'none';
  await loadFromCloud();
}
async function initAuth() {
  if (!window.supabase) {
    let local = null; try { local = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
    loadCollection(local);
    showAuth('Keine Verbindung zum Anmelde-Dienst. Internetverbindung prüfen und Seite neu laden.');
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  loadCollection(null);
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) { startApp(data.session.user); return; }
  } catch (e) {}
  showAuth('');
}
document.getElementById('authSubmit').onclick = async () => {
  const email = document.getElementById('authEmail').value.trim();
  const pw = document.getElementById('authPw').value;
  const err = document.getElementById('authErr');
  err.textContent = '';
  if (!sb) { err.textContent = 'Keine Verbindung zum Anmelde-Dienst.'; return; }
  if (!email || !pw) { err.textContent = 'Bitte E-Mail und Passwort eingeben.'; return; }
  const register = document.getElementById('authForm').dataset.mode === 'register';
  try {
    if (register) {
      const { data, error } = await sb.auth.signUp({ email, password: pw });
      if (error) throw error;
      if (data.session) startApp(data.session.user);
      else err.textContent = 'Konto erstellt – bitte E-Mail bestätigen, dann anmelden.';
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
      startApp(data.user);
    }
  } catch (e) { err.textContent = e.message || String(e); }
};
document.getElementById('authToggle').onclick = () => {
  const f = document.getElementById('authForm');
  const toRegister = f.dataset.mode !== 'register';
  f.dataset.mode = toRegister ? 'register' : 'login';
  document.getElementById('authTitle').textContent = toRegister ? 'Konto erstellen' : 'Anmelden';
  document.getElementById('authSubmit').textContent = toRegister ? 'Registrieren' : 'Anmelden';
  document.getElementById('authToggle').textContent = toRegister ? 'Schon ein Konto? Anmelden' : 'Neues Konto erstellen';
  document.getElementById('authErr').textContent = '';
};
document.getElementById('authPw').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('authSubmit').click();
});
document.getElementById('logoutBtn').onclick = async () => {
  try { if (sb) await sb.auth.signOut(); } catch (e) {}
  location.reload();
};

/* ---------- Start ---------- */
initAuth();
</script>
